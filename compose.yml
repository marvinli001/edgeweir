# Edgeweir console + PostgreSQL 18.
#   docker compose up -d                        # console + postgres
#   docker compose --profile analytics up -d    # + ClickHouse
#   docker compose --profile cache up -d        # + Valkey
# Secrets come from .env (see .env.example). The console refuses to start
# without EDGEWEIR_MASTER_KEY and BETTER_AUTH_SECRET.
name: edgeweir

x-console-env: &console-env
  DATABASE_URL: postgres://edgeweir:${POSTGRES_PASSWORD:-edgeweir}@postgres:5432/edgeweir
  EDGEWEIR_MASTER_KEY: ${EDGEWEIR_MASTER_KEY:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  EDGEWEIR_PUBLIC_URL: ${EDGEWEIR_PUBLIC_URL:-http://localhost:3000}
  EDGEWEIR_NODE_API_URL: ${EDGEWEIR_NODE_API_URL:-}
  EDGEWEIR_NODE_API_HOSTNAMES: ${EDGEWEIR_NODE_API_HOSTNAMES:-}
  EDGEWEIR_ANALYTICS: ${EDGEWEIR_ANALYTICS:-lite}

services:
  console:
    image: ghcr.io/edgeweir/edgeweir:${EDGEWEIR_VERSION:-latest}
    build:
      context: .
    restart: unless-stopped
    environment:
      <<: *console-env
      ROLE: all
    ports:
      # Web console + API. May sit behind a reverse proxy (TLS there is fine).
      - "${EDGEWEIR_HTTP_PORT:-3000}:3000"
      # Node channel. Must reach the console directly or via TCP passthrough:
      # the console terminates TLS itself (mutual TLS with node certificates).
      - "${EDGEWEIR_NODE_API_PORT:-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edgeweir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgeweir}
      POSTGRES_DB: edgeweir
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeweir -d edgeweir"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.9-alpine
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: edgeweir
      CLICKHOUSE_USER: edgeweir
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-edgeweir}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  valkey:
    image: valkey/valkey:9.2-alpine
    profiles: ["cache"]
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]

volumes:
  postgres-data:
  clickhouse-data:
