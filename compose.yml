# Edgeweir console + PostgreSQL 18.
#   docker compose up -d                        # console + postgres
#   docker compose --profile analytics up -d    # + ClickHouse
#   docker compose --profile cache up -d        # + Valkey
# Secrets come from .env (see .env.example). The console refuses to start
# without EDGEWEIR_MASTER_KEY; the session secret is derived from it unless
# BETTER_AUTH_SECRET is set (deployments that set it keep it).
# The console image is pulled from ghcr.io (rolling <YYYYMMDD>-<commit> tags,
# pinned with EDGEWEIR_VERSION); `docker compose up -d --build` builds it from
# this checkout instead.
name: edgeweir

x-console-env: &console-env
  DATABASE_URL: postgres://edgeweir:${POSTGRES_PASSWORD:-edgeweir}@postgres:5432/edgeweir
  EDGEWEIR_MASTER_KEY: ${EDGEWEIR_MASTER_KEY:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  EDGEWEIR_PUBLIC_URL: ${EDGEWEIR_PUBLIC_URL:-http://localhost:3000}
  EDGEWEIR_NODE_API_URL: ${EDGEWEIR_NODE_API_URL:-}
  EDGEWEIR_NODE_API_HOSTNAMES: ${EDGEWEIR_NODE_API_HOSTNAMES:-}
  EDGEWEIR_ANALYTICS: ${EDGEWEIR_ANALYTICS:-lite}
  EDGEWEIR_CLICKHOUSE_URL: ${EDGEWEIR_CLICKHOUSE_URL:-http://clickhouse:8123}
  EDGEWEIR_CLICKHOUSE_DATABASE: ${EDGEWEIR_CLICKHOUSE_DATABASE:-edgeweir}
  EDGEWEIR_CLICKHOUSE_USER: ${EDGEWEIR_CLICKHOUSE_USER:-edgeweir}
  EDGEWEIR_CLICKHOUSE_PASSWORD: ${EDGEWEIR_CLICKHOUSE_PASSWORD:-${CLICKHOUSE_PASSWORD:-edgeweir}}
  EDGEWEIR_OUTBOUND_ALLOW_CIDRS: ${EDGEWEIR_OUTBOUND_ALLOW_CIDRS:-}
  EDGEWEIR_ACME_DIRECTORY: ${EDGEWEIR_ACME_DIRECTORY:-}
  EDGEWEIR_ACME_CA_FILE: ${EDGEWEIR_ACME_CA_FILE:-}
  # Fallbacks for existing deployments: a value saved in 后台 → 系统设置 wins.
  EDGEWEIR_NODE_RELEASE_BASE_URL: ${EDGEWEIR_NODE_RELEASE_BASE_URL:-}
  EDGEWEIR_SMTP_CA_FILE: ${EDGEWEIR_SMTP_CA_FILE:-}
  EDGEWEIR_DNS_RESOLVERS: ${EDGEWEIR_DNS_RESOLVERS:-}
  EDGEWEIR_TELEMETRY: ${EDGEWEIR_TELEMETRY:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Release mirror for install.sh; mount it below (see docs/deploy/nodes.md).
  EDGEWEIR_DOWNLOADS_DIR: ${EDGEWEIR_DOWNLOADS_DIR:-}
  # Reverse proxies whose X-Forwarded-For is believed (IPs/CIDRs, comma separated).
  EDGEWEIR_TRUSTED_PROXIES: ${EDGEWEIR_TRUSTED_PROXIES:-}

services:
  console:
    image: ghcr.io/marvinli001/edgeweir:${EDGEWEIR_VERSION:-latest}
    build:
      context: .
    restart: unless-stopped
    environment:
      <<: *console-env
      ROLE: all
    ports:
      # Web console + API. May sit behind a reverse proxy (TLS there is fine).
      - "${EDGEWEIR_HTTP_PORT:-3000}:3000"
      # Node channel. Must reach the console directly or via TCP passthrough:
      # the console terminates TLS itself (mutual TLS with node certificates).
      - "${EDGEWEIR_NODE_API_PORT:-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # Release mirror for install.sh, with EDGEWEIR_DOWNLOADS_DIR=/srv/edgeweir-downloads:
    # volumes:
    #   - ./downloads:/srv/edgeweir-downloads:ro
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: edgeweir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgeweir}
      POSTGRES_DB: edgeweir
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeweir -d edgeweir"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.9-alpine@sha256:7ad5e1f369d243e3d5d3bb1fe926147b251bb14c08cdb833bd421d191d476b9f
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${EDGEWEIR_CLICKHOUSE_DATABASE:-edgeweir}
      CLICKHOUSE_USER: ${EDGEWEIR_CLICKHOUSE_USER:-edgeweir}
      CLICKHOUSE_PASSWORD: ${EDGEWEIR_CLICKHOUSE_PASSWORD:-${CLICKHOUSE_PASSWORD:-edgeweir}}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  valkey:
    image: valkey/valkey:9.2-alpine@sha256:cdcb7b1c7b6f1c9cb9442c71ac6275e78184657448407b2c1fdde7ee8024f4fb
    profiles: ["cache"]
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]

volumes:
  postgres-data:
  clickhouse-data:
