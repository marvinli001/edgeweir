# Static test origin for scripts/e2e.sh (MVP M2): serves /srv over HTTP
# (Range requests for slice caching) and HTTPS with a self-signed
# certificate generated at start (origin certificate verification).
worker_processes 1;
error_log stderr warn;
pid /tmp/files.pid;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen 80;
        listen 443 ssl;
        server_name files;
        ssl_certificate /tmp/files.crt;
        ssl_certificate_key /tmp/files.key;
        root /srv;
        location / {
            add_header X-Origin files;
        }
    }
}
