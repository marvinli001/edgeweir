# Static test origin for scripts/e2e.sh (MVP M2): serves /srv over HTTP
# (Range requests for slice caching; /tmp/access.log records the Range
# header every request arrived with) and over HTTPS: :443 with a self-signed
# certificate, :9443 with a certificate for "files" issued by the test CA the
# node trusts (origin certificate verification and name checks). The
# certificates are generated at start (compose.e2e.yml).
# G3 (scripts/e2e-g3.mjs): /g3/ serves text the edge compresses and
# /g3-encoded/ answers with Content-Encoding: gzip whatever the request
# accepts (the files there are gzip data), so the edge must pass it on as it
# is; /tmp/g3.log records the Accept-Encoding the origin received.
worker_processes 1;
error_log stderr warn;
pid /tmp/files.pid;
events { worker_connections 256; }
http {
    access_log off;
    log_format ranges '$server_port $request_method $uri range="$http_range" status=$status';
    log_format g3 '$request_method $uri ae="$http_accept_encoding" status=$status';
    server {
        listen 80;
        listen 443 ssl;
        server_name files;
        ssl_certificate /tmp/files.crt;
        ssl_certificate_key /tmp/files.key;
        access_log /tmp/access.log ranges;
        root /srv;
        location / {
            add_header X-Origin files;
        }
        location /g3/ {
            access_log /tmp/g3.log g3;
        }
        location /g3-encoded/ {
            access_log /tmp/g3.log g3;
            add_header Content-Encoding gzip;
        }
    }
    server {
        listen 9443 ssl;
        server_name files;
        ssl_certificate /tmp/trusted.crt;
        ssl_certificate_key /tmp/trusted.key;
        access_log /tmp/access.log ranges;
        root /srv;
        location / {
            add_header X-Origin files-trusted-ca;
        }
    }
}
