# A CDN in front of the console for scripts/e2e-cdn.mjs, like an orange-cloud
# Cloudflare name: cdn.e2e.test:443 terminates TLS with a certificate from a
# test CA (generated at start) and proxies every path to the web port,
# WebSocket upgrades and custom headers included; cdn.e2e.test:8443
# terminates TLS too and opens a new TLS connection to the node channel, so
# nodes there see the CDN's certificate instead of the node CA and mTLS
# cannot pass. Upstreams resolve at request time: the console may start later.
worker_processes 1;
error_log stderr warn;
pid /tmp/cdn-proxy.pid;
events { worker_connections 256; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    log_format upgrades '$request_method $uri $status protocol="$http_sec_websocket_protocol" check=$check_header';
    map $http_x_edgeweir_channel_check $check_header { "" 0; default 1; }
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    access_log /dev/stdout upgrades;
    server {
        listen 443 ssl;
        server_name cdn.e2e.test;
        ssl_certificate /tmp/cdn.crt;
        ssl_certificate_key /tmp/cdn.key;
        location / {
            set $console console;
            proxy_pass http://$console:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
stream {
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8443 ssl;
        ssl_certificate /tmp/cdn.crt;
        ssl_certificate_key /tmp/cdn.key;
        set $console console;
        proxy_pass $console:8443;
        proxy_ssl on;
    }
}
