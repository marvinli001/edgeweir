# G9 (scripts/e2e-g9.mjs): a layer-4 load balancer in front of the edge node
# of cluster g9-proxy (network alias g9-edge, started by the script). Every
# connection reaches the node with a PROXY protocol v2 header naming the
# client; the node is resolved per connection, so the balancer starts
# before the node exists.
worker_processes 1;
error_log stderr notice;
pid /tmp/g9-lb.pid;
events { worker_connections 1024; }
stream {
  resolver 127.0.0.11 valid=2s ipv6=off;
  server {
    listen 80;
    listen 443;
    listen 8081;
    listen 9443;
    proxy_pass g9-edge:$server_port;
    proxy_protocol v2;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
  }
  # The same hop without the header, for the bench baseline of a node in
  # the direct mode (BENCH_SCENARIO=proxy-plain). A variable keeps this
  # upstream resolved per connection too: a literal name is resolved when
  # the configuration loads and stops the balancer before the node exists.
  map $server_port $g9_plain { default g9-edge:80; }
  server {
    listen 18080;
    proxy_pass $g9_plain;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
  }
}
