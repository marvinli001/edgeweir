# TLS-terminating reverse proxy in front of the console's web port for the
# wss section (scripts/e2e-wss.mjs, profile wss): wss.e2e.test:443 with a
# certificate from a test CA (generated at start, compose.e2e.yml), and the
# /node-channel location of docs/deploy/networking.md. The node channel's
# own TLS runs inside the WebSocket and is terminated by the console.
worker_processes 1;
error_log stderr warn;
pid /tmp/wss-proxy.pid;
events { worker_connections 256; }
http {
    log_format upgrades '$request_method $uri $status protocol="$http_sec_websocket_protocol"';
    access_log /dev/stdout upgrades;
    server {
        listen 443 ssl;
        server_name wss.e2e.test;
        ssl_certificate /tmp/wss.crt;
        ssl_certificate_key /tmp/wss.key;
        location = /node-channel {
            proxy_pass http://console:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
        location / {
            return 404;
        }
    }
}
