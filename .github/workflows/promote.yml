name: Promote

# Stable channel (docs/deploy/upgrade.md): points ghcr.io/marvinli001/edgeweir:stable
# at the digest of a dated tag that release.yml published from master. Nothing is
# rebuilt or signed again: the signature, SBOM and provenance belong to the digest.
# Rolling back is promoting an earlier dated tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Dated tag to mark stable (<YYYYMMDD>-<commit>)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  stable:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/marvinli001/edgeweir
      VERSION: ${{ inputs.version }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/master
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag's commit must be on master
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: source
        name: Check the dated tag
        run: |
          if ! [[ $VERSION =~ ^[0-9]{8}-[0-9a-f]{7}$ ]]; then
            echo "::error::expected <YYYYMMDD>-<commit>, got \"$VERSION\""
            exit 1
          fi
          revision=$(git rev-parse --verify --quiet "${VERSION#*-}^{commit}") || {
            echo "::error::no commit ${VERSION#*-} in this repository"
            exit 1
          }
          if [ "$(scripts/image-version.sh "$revision")" != "$VERSION" ]; then
            echo "::error::$VERSION is not the version of $revision ($(scripts/image-version.sh "$revision"))"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$revision" origin/master; then
            echo "::error::$revision is not on master"
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          # Signed by release.yml on master for exactly this commit.
          cosign verify "$IMAGE@$digest" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            --certificate-github-workflow-sha "$revision" >/dev/null
          {
            echo "revision=$revision"
            echo "digest=$digest"
            echo "previous=$(docker buildx imagetools inspect "$IMAGE:stable" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest || true)"
          } >> "$GITHUB_OUTPUT"
      - name: Move stable
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE@$DIGEST"
      - name: Verify stable
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          now=$(docker buildx imagetools inspect "$IMAGE:stable" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$now" != "$DIGEST" ]; then
            echo "::error::stable is $now, expected $DIGEST"
            exit 1
          fi
          cosign verify "$IMAGE:stable" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            --certificate-github-workflow-sha "$REVISION" >/dev/null
      - name: Summary
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
          REVISION: ${{ steps.source.outputs.revision }}
          PREVIOUS: ${{ steps.source.outputs.previous }}
        run: |
          {
            echo "### $IMAGE:stable → $VERSION"
            echo
            echo "Commit \`$REVISION\`, digest \`$DIGEST\`; previous stable \`${PREVIOUS:-none}\`."
          } >> "$GITHUB_STEP_SUMMARY"
