name: Release

# Publish the exact candidate that passed complete acceptance; never rebuild it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  eligibility:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
      actions: read
    outputs:
      publish: ${{ steps.acceptance.outputs.verified }}
      candidate_run_id: ${{ steps.acceptance.outputs.candidate_run_id }}
      candidate_digest: ${{ steps.acceptance.outputs.candidate_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/ci-verify.py resolve --sha "$(git rev-parse HEAD)" --require
          else
            python3 scripts/ci-verify.py resolve --sha "$(git rev-parse HEAD)"
          fi

  image:
    needs: eligibility
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/marvinli001/edgeweir
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: acceptance
        run: python3 scripts/ci-verify.py resolve --sha "$(git rev-parse HEAD)" --require
      - name: Download the accepted OCI archive
        if: steps.acceptance.outputs.candidate_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-image
          path: .local/ci-candidate
          run-id: ${{ steps.acceptance.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install verified cosign 3.1.3
        run: bash scripts/ci-cosign.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the accepted runtime and preserve its digest
        id: publish
        env:
          CANDIDATE_DIGEST: ${{ steps.acceptance.outputs.candidate_digest }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          if [ -n "$CANDIDATE_DIGEST" ]; then
            python3 scripts/ci-image.py smoke --digest "$CANDIDATE_DIGEST"
            python3 scripts/ci-image.py promote --digest "$CANDIDATE_DIGEST"
          else
            python3 scripts/ci-image.py smoke
            python3 scripts/ci-image.py promote
          fi
      - name: Sign the published digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest acceptance without claiming to rebuild the image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign attest --yes --type https://edgeweir.dev/acceptance/v1 --predicate .local/ci-candidate/verification.json "$IMAGE@$DIGEST"
      - name: Summary
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: echo "$IMAGE:$VERSION published at $DIGEST from the accepted candidate; no rebuild." >> "$GITHUB_STEP_SUMMARY"
