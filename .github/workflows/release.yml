name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless + provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Reproducible timestamps
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/edgeweir/edgeweir
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Sign the image (cosign keyless)
        run: cosign sign --yes "ghcr.io/edgeweir/edgeweir@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/edgeweir/edgeweir
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
