name: Release

# Rolling releases, no version tags (ADR-0017, update 2026-09-29): every master
# commit whose CI run passed is published as
#   ghcr.io/marvinli001/edgeweir:<YYYYMMDD>-<commit>   (scripts/image-version.sh)
# and :latest moves to it while it is still the tip of master. A manual run
# rebuilds the tip of master, for example after a base image refresh.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless + provenance
      attestations: write
    env:
      IMAGE: ghcr.io/marvinli001/edgeweir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # origin/master decides whether :latest moves
          persist-credentials: false
      - id: version
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          version="$(scripts/image-version.sh)"
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git log -1 --format=%cI)"
            echo "tags<<EOF"
            echo "$IMAGE:$version"
            # :latest never moves backwards: skip it once master has moved on.
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: org.opencontainers.image.created=${{ steps.version.outputs.created }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.version.outputs.revision }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
      - name: Sign the image (cosign keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        run: |
          {
            echo "### $IMAGE:${{ steps.version.outputs.version }}"
            echo
            echo "Commit \`${{ steps.version.outputs.revision }}\`, digest \`${{ steps.build.outputs.digest }}\`."
            echo
            echo '```'
            echo "${{ steps.version.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
