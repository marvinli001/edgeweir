name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generated TypeScript matches proto/
        run: pnpm proto:gen && git diff --exit-code -- packages/proto
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  certd:
    name: edgeweir-certd (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpers/certd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: helpers/certd/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  image:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: end-to-end (compose.e2e.yml)
    runs-on: ubuntu-latest
    needs: checks
    env:
      EDGEWEIR_NODE_CONTEXT: ./edgeweir-node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: edgeweir/edgeweir-node
          path: edgeweir-node
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @edgeweir/console exec playwright install --with-deps chromium
      - run: docker compose -f compose.e2e.yml up -d --build
      - run: bash scripts/e2e.sh
      - if: failure()
        run: docker compose -f compose.e2e.yml logs
      - if: always()
        run: docker compose -f compose.e2e.yml down -v
