name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [auto, full]
        default: auto
      base:
        description: Optional comparison commit
        type: string

permissions:
  contents: read
  statuses: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The e2e install step's snapshot packages, the same version as the node repository's CI.
  GORELEASER_VERSION: v2.18.2

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.plan.outputs.product }}
      checks: ${{ steps.plan.outputs.checks }}
      certd: ${{ steps.plan.outputs.certd }}
      image: ${{ steps.plan.outputs.image }}
      containers: ${{ steps.plan.outputs.containers }}
      full: ${{ steps.plan.outputs.full }}
      reuse: ${{ steps.plan.outputs.reuse }}
      e2e_sections: ${{ steps.plan.outputs.e2e_sections }}
      e2e_shards: ${{ steps.plan.outputs.e2e_shards }}
      node_revision: ${{ steps.node.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCOPE: ${{ inputs.scope }}
          CI_BASE_SHA: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
          CI_ALLOW_REUSE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: python3 scripts/ci-plan.py
      - id: node
        run: |
          revision=$(cat .github/node-revision)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  checks:
    name: lint · typecheck · test · build
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    services:
      # Tests of concurrent transactions (PGlite runs one at a time).
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: python3 -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Generated TypeScript matches proto/
        run: pnpm proto:gen && git diff --exit-code -- packages/proto
      - name: proto/ stays compatible with the newest proto tag
        run: pnpm proto:breaking
        env:
          PROTO_REMOTE: https://github.com/${{ github.repository }}.git
      - run: pnpm typecheck
      - if: needs.changes.outputs.reuse != 'true'
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          EDGEWEIR_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

  certd:
    name: edgeweir-certd (Go)
    needs: changes
    if: needs.changes.outputs.certd == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpers/certd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helpers/certd/go.mod
          cache-dependency-path: helpers/certd/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  image:
    name: build image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          echo "version=$(scripts/image-version.sh)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          mkdir -p .local/ci-candidate
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=.local/ci-candidate/image.tar
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          labels: org.opencontainers.image.created=${{ steps.version.outputs.created }}
          cache-from: type=gha,scope=console-image
          cache-to: type=gha,scope=console-image,mode=max
          sbom: true
          provenance: mode=max
      - name: Inspect the immutable candidate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          python3 scripts/ci-image.py inspect
      - name: Attest where the candidate was actually built
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/marvinli001/edgeweir
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Upload the candidate image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-image
          path: .local/ci-candidate/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  # Build products of the pinned edgeweir-node checkout the e2e shards share:
  # edgeweir-openresty packages, the goreleaser snapshot and the old node
  # images of e2e-g3/e2e-g8 (scripts/e2e-fixtures.sh). Saved as soon as they
  # are built, so failed or cancelled e2e runs never throw them away.
  fixtures:
    name: e2e fixtures
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marvinli001/edgeweir-node
          ref: ${{ needs.changes.outputs.node_revision }}
          path: edgeweir-node
          fetch-depth: 0
          persist-credentials: false
      - id: key
        env:
          NODE_REVISION: ${{ needs.changes.outputs.node_revision }}
          SCRIPTS: ${{ hashFiles('scripts/e2e-cache.mjs', 'scripts/e2e-fixtures.sh') }}
        run: echo "key=$RUNNER_OS-$RUNNER_ARCH-e2e-fixtures-v2-$NODE_REVISION-goreleaser-$GORELEASER_VERSION-$SCRIPTS" >> "$GITHUB_OUTPUT"
      # Entries are keyed by content (commit, tree), so an older cache is a valid start.
      - id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/edgeweir-e2e
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-e2e-fixtures-v2-
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edgeweir-node/go.mod
          cache-dependency-path: edgeweir-node/go.sum
      - if: steps.restore.outputs.cache-hit != 'true'
        name: Install Syft 1.52.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-syft.sh
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.restore.outputs.cache-hit != 'true'
        name: Build what the cache lacks
        run: bash scripts/e2e-fixtures.sh all ./edgeweir-node .e2e
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/edgeweir-e2e
          key: ${{ steps.key.outputs.key }}

  e2e:
    name: end-to-end (compose.e2e.yml)
    runs-on: ubuntu-latest
    # Not after the image job: every shard prepares while the image builds and
    # waits for the candidate just before the run (containers implies image).
    needs: [changes, fixtures]
    if: needs.changes.outputs.containers == 'true'
    strategy:
      # Every shard reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        # scripts/e2e.sh --shards for a complete run, 0 (one job) for selected sections.
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    env:
      EDGEWEIR_NODE_CONTEXT: ./edgeweir-node
      CI_E2E_SECTIONS: ${{ needs.changes.outputs.e2e_sections }}
      CI_E2E_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marvinli001/edgeweir-node
          ref: ${{ needs.changes.outputs.node_revision }}
          path: edgeweir-node
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the e2e fixtures
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/edgeweir-e2e
          key: ${{ needs.fixtures.outputs.key }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-e2e-fixtures-v2-
      # The install step checks the goreleaser config and builds what the
      # cache lacks (same tool versions as the node repository's CI).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edgeweir-node/go.mod
          cache-dependency-path: edgeweir-node/go.sum
      - name: Install Syft 1.52.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-syft.sh
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Install verified cosign 3.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-cosign.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter @edgeweir/console exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
      # Browsers per Playwright version: the shards no longer download Chromium each.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter @edgeweir/console exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build isolated E2E images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.e2e.yml
          targets: |
            node
            geoip-fixture
          load: true
          set: |
            node.args.OPENRESTY_JOBS=4
            node.cache-from=type=gha,scope=e2e-node
            node.cache-to=type=gha,scope=e2e-node,mode=max
            geoip-fixture.cache-from=type=gha,scope=e2e-geoip
            geoip-fixture.cache-to=type=gha,scope=e2e-geoip,mode=max
      - name: Wait for the candidate image
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-wait-image.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-image
          path: .local/ci-candidate
      - name: Load the same console image the release will publish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          python3 scripts/ci-image.py load
      - run: bash scripts/ci-accept.sh e2e
      - if: failure()
        run: docker compose -f compose.e2e.yml logs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            .e2e/timings.tsv
            .e2e/lane-*.tsv
            apps/console/test-results/
          include-hidden-files: true
          retention-days: 7
      - if: always()
        run: docker compose -f compose.e2e.yml --profile analytics --profile upgrades down -v

  acceptance:
    if: always() && needs.changes.outputs.product == 'true'
    needs: [changes, checks, certd, image, fixtures, e2e]
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ toJSON(needs.changes.outputs) }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          plan, results = json.loads(os.environ['PLAN']), json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success'
          for job, key in [('checks', 'checks'), ('certd', 'certd'), ('image', 'image'), ('fixtures', 'containers'), ('e2e', 'containers')]:
              expected = 'success' if plan[key] == 'true' else 'skipped'
              assert results[job]['result'] == expected, (job, results[job]['result'], expected)
          PY_GATE

  full-acceptance:
    needs: [changes, acceptance]
    # A reused proof keeps its original expiry; only fresh tests create this CI gate.
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
