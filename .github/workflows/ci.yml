name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.changes.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          product=$(bash scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA")
          echo "product=$product" >> "$GITHUB_OUTPUT"

  checks:
    name: lint · typecheck · test · build
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    services:
      # Tests of concurrent transactions (PGlite runs one at a time).
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generated TypeScript matches proto/
        run: pnpm proto:gen && git diff --exit-code -- packages/proto
      - name: proto/ stays compatible with the newest proto tag
        run: pnpm proto:breaking
        env:
          PROTO_REMOTE: https://github.com/${{ github.repository }}.git
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          EDGEWEIR_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: pnpm build

  certd:
    name: edgeweir-certd (Go)
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpers/certd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helpers/certd/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  image:
    name: build image
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "version=$(scripts/image-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=console-image
          cache-to: type=gha,scope=console-image,mode=max

  e2e:
    name: end-to-end (compose.e2e.yml)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.product == 'true'
    env:
      EDGEWEIR_NODE_CONTEXT: ./edgeweir-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marvinli001/edgeweir-node
          path: edgeweir-node
          fetch-depth: 0
      - name: Restore immutable E2E fixtures
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/edgeweir-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-e2e-fixtures-${{ hashFiles('scripts/e2e-cache.mjs', 'scripts/e2e-g3.mjs', 'scripts/e2e-g8.mjs', 'edgeweir-node/packaging/openresty/**') }}
      # scripts/e2e.sh builds goreleaser snapshot packages of the node for the
      # install.sh step (same tool versions as the node repository's CI).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edgeweir-node/go.mod
          cache-dependency-path: edgeweir-node/go.sum
      - name: Install Syft 1.52.0
        run: |
          syft_dir="$RUNNER_TEMP/syft"
          mkdir -p "$syft_dir"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/anchore/syft/releases/assets/570445809 \
            -o "$syft_dir/syft.tar.gz"
          printf '%s  %s\n' caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d "$syft_dir/syft.tar.gz" | sha256sum -c -
          tar -xzf "$syft_dir/syft.tar.gz" -C "$syft_dir" syft
          "$syft_dir/syft" version
          echo "$syft_dir" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true
      - name: Install verified cosign 3.1.3
        run: bash scripts/ci-cosign.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @edgeweir/console exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build isolated E2E images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          source: .
          files: compose.e2e.yml
          targets: |
            console
            node
            geoip-fixture
          load: true
          set: |
            console.cache-from=type=gha,scope=e2e-console
            console.cache-to=type=gha,scope=e2e-console,mode=max
            node.cache-from=type=gha,scope=e2e-node
            node.cache-to=type=gha,scope=e2e-node,mode=max
            geoip-fixture.cache-from=type=gha,scope=e2e-geoip
            geoip-fixture.cache-to=type=gha,scope=e2e-geoip,mode=max
      - run: docker compose -f compose.e2e.yml up -d --no-build
      - run: bash scripts/e2e.sh
      - if: failure()
        run: docker compose -f compose.e2e.yml logs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: |
            .e2e/timings.tsv
            .e2e/lane-*.tsv
            apps/console/test-results/
          include-hidden-files: true
          retention-days: 7
      - if: always()
        run: docker compose -f compose.e2e.yml --profile analytics --profile upgrades down -v
