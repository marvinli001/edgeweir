name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generated TypeScript matches proto/
        run: pnpm proto:gen && git diff --exit-code -- packages/proto
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  certd:
    name: edgeweir-certd (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpers/certd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: helpers/certd/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  image:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: end-to-end (compose.e2e.yml)
    runs-on: ubuntu-latest
    needs: checks
    env:
      EDGEWEIR_NODE_CONTEXT: ./edgeweir-node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: marvinli001/edgeweir-node
          path: edgeweir-node
          fetch-depth: 0
      # scripts/e2e.sh builds goreleaser snapshot packages of the node for the
      # install.sh step (same tool versions as the node repository's CI).
      - uses: actions/setup-go@v7
        with:
          go-version-file: edgeweir-node/go.mod
          cache-dependency-path: edgeweir-node/go.sum
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.52.0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @edgeweir/console exec playwright install --with-deps chromium
      - run: docker compose -f compose.e2e.yml up -d --build
      - run: bash scripts/e2e.sh
      - if: failure()
        run: docker compose -f compose.e2e.yml logs
      - if: always()
        run: docker compose -f compose.e2e.yml --profile analytics --profile upgrades down -v
