syntax = "proto3";

package edgeweir.node.v1;

import "google/protobuf/timestamp.proto";

// ProbeService runs on the node channel next to NodeService. Probes are
// `edgeweir-node probe` processes that measure, from their region, whether
// the scheduling addresses of the cluster nodes answer. EnrollProbe is
// authenticated by a one-time probe token; every other call requires mutual
// TLS with a probe certificate (O=Edgeweir Probe) or, for a node the
// operator lets probe from its node group's region, that node's own
// certificate. Probe certificates never reach NodeService. Added in v0.14.0.
service ProbeService {
  // EnrollProbe exchanges a one-time probe token and a CSR for a probe
  // certificate signed by the node CA.
  rpc EnrollProbe(EnrollProbeRequest) returns (EnrollProbeResponse);
  // RenewProbeCertificate signs a new CSR for an enrolled probe.
  rpc RenewProbeCertificate(RenewProbeCertificateRequest) returns (RenewProbeCertificateResponse);
  // GetProbeTargets returns what to probe and how often.
  rpc GetProbeTargets(GetProbeTargetsRequest) returns (GetProbeTargetsResponse);
  // ReportProbeResults stores one round of results.
  rpc ReportProbeResults(ReportProbeResultsRequest) returns (ReportProbeResultsResponse);
}

// ProbeInfo describes the probe process.
message ProbeInfo {
  string hostname = 1;
  string agent_version = 2;
  string os = 3;
  string arch = 4;
}

// EnrollProbeRequest carries the token, the probe's CSR (its private key
// never leaves the probe) and a description of the probe.
message EnrollProbeRequest {
  string token = 1;
  string csr_pem = 2;
  ProbeInfo info = 3;
}

// EnrollProbeResponse returns the probe's identity and certificate.
message EnrollProbeResponse {
  string probe_id = 1;
  string probe_name = 2;
  string region_id = 3;
  string certificate_pem = 4;
  string ca_certificate_pem = 5;
  google.protobuf.Timestamp not_after = 6;
}

// RenewProbeCertificateRequest carries a CSR for a new key.
message RenewProbeCertificateRequest {
  string csr_pem = 1;
}

// RenewProbeCertificateResponse returns the renewed certificate.
message RenewProbeCertificateResponse {
  string certificate_pem = 1;
  string ca_certificate_pem = 2;
  google.protobuf.Timestamp not_after = 3;
}

// GetProbeTargetsRequest identifies the probe process (the certificate
// identifies the probe).
message GetProbeTargetsRequest {
  ProbeInfo info = 1;
}

// ProbeMethod is how a target is probed.
enum ProbeMethod {
  PROBE_METHOD_UNSPECIFIED = 0;
  // A TCP connection, closed once established.
  PROBE_METHOD_TCP = 1;
  // GET /.edgeweir/health over HTTP, answered by the node before any site
  // lookup (feature probe-health-v1); success is status 200.
  PROBE_METHOD_HTTP = 2;
  // The same over TLS with SNI health.edgeweir.invalid (the node answers it
  // with a self-signed certificate; probes do not verify it).
  PROBE_METHOD_HTTPS = 3;
}

// ProbeTarget is one scheduling address and listener port of a node.
message ProbeTarget {
  string node_id = 1;
  // IP literal.
  string address = 2;
  uint32 port = 3;
  ProbeMethod method = 4;
  // Send a PROXY protocol v1 header first (the listener requires one).
  bool proxy_protocol = 5;
}

// GetProbeTargetsResponse lists the targets of one round. Targets are sorted
// by (node_id, address, port).
message GetProbeTargetsResponse {
  repeated ProbeTarget targets = 1;
  // Seconds between rounds, 5-60.
  uint32 interval_seconds = 2;
  // Milliseconds an attempt may take, 500-10000.
  uint32 timeout_ms = 3;
  // Attempts per target and round, 1-10.
  uint32 attempts = 4;
  // The probe certificate should be renewed (RenewProbeCertificate).
  bool renew_certificate = 5;
}

// ProbeResult is one target's outcome in a round.
message ProbeResult {
  string node_id = 1;
  string address = 2;
  uint32 port = 3;
  ProbeMethod method = 4;
  // Attempts made and attempts that failed (no answer within the timeout,
  // refused, reset, or for HTTP(S) a status other than 200).
  uint32 sent = 5;
  uint32 lost = 6;
  // Median round-trip time of the successful attempts in milliseconds; 0
  // when every attempt failed.
  uint32 rtt_ms = 7;
  // Short error code of the last failure ("timeout", "refused", "reset",
  // "tls", "status", "unreachable"), empty without failures.
  string error = 8;
}

// ReportProbeResultsRequest carries one round.
message ReportProbeResultsRequest {
  google.protobuf.Timestamp started_at = 1;
  repeated ProbeResult results = 2;
}

// ReportProbeResultsResponse acknowledges a round.
message ReportProbeResultsResponse {
  uint32 accepted = 1;
}
