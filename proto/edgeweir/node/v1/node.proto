syntax = "proto3";

package edgeweir.node.v1;

import "edgeweir/node/v1/config.proto";
import "google/protobuf/timestamp.proto";

// NodeService is the channel between edgeweir-node agents and the console.
//
// Transport: Connect protocol over HTTPS on a dedicated port (default :8443).
// TLS is terminated by the console itself, never by a reverse proxy.
//
// Authentication:
//   - Enroll is the only RPC callable without a client certificate. It is
//     authorised by a single-use enrollment token. The agent pins the
//     console's internal CA by SHA-256 fingerprint (given in the install
//     command) before sending the token.
//   - Every other RPC requires mutual TLS with a client certificate issued by
//     the console's internal CA; the certificate subject CN is the node id.
service NodeService {
  // Enroll exchanges a single-use token and a CSR for a node certificate.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // RenewCertificate issues a fresh certificate for an enrolled node.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  // WatchConfig streams revision notifications. The first message always
  // carries the latest revision; keepalives are sent periodically. Agents must
  // also poll GetConfig as a fallback when the stream is unavailable.
  rpc WatchConfig(WatchConfigRequest) returns (stream WatchConfigResponse);
  // GetConfig returns a full snapshot or a diff against base_revision.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // ReportStatus is the heartbeat and apply receipt of a node.
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
  // ReportStats uploads per-minute pre-aggregated traffic statistics.
  rpc ReportStats(ReportStatsRequest) returns (ReportStatsResponse);
  // Sequenced statistics endpoint. A pre-M5 console returns Unimplemented
  // instead of processing retryable batches without deduplication.
  rpc ReportStatsV2(ReportStatsV2Request) returns (ReportStatsV2Response);
  // Sequenced sampled logs; an empty sequence-zero request reads the cursor.
  rpc ReportLogs(ReportLogsRequest) returns (ReportLogsResponse);
  // GetOriginCredentials returns origin credentials (e.g. S3 access keys)
  // referenced by the node's cluster configuration. Secrets only travel over
  // this mutually authenticated channel and never inside NodeConfig.
  rpc GetOriginCredentials(GetOriginCredentialsRequest) returns (GetOriginCredentialsResponse);
  // Certificate material is returned only to nodes serving the referencing site.
  rpc GetCertificates(GetCertificatesRequest) returns (GetCertificatesResponse);
  // PullTasks hands out pending typed tasks (cache purge, prefetch). Tasks
  // are idempotent: a task is handed out again when no result arrives.
  rpc PullTasks(PullTasksRequest) returns (PullTasksResponse);
  // ReportTaskResult records the outcome of a task on the calling node.
  rpc ReportTaskResult(ReportTaskResultRequest) returns (ReportTaskResultResponse);
  // GetBans returns the dynamic IP bans of the node's cluster, incrementally
  // by sequence. Bans never travel in NodeConfig and never create a
  // revision. Added in v0.9.0 (feature bans-v1).
  rpc GetBans(GetBansRequest) returns (GetBansResponse);
  // ReportBans uploads bans the node created itself (automatic mitigation).
  // Idempotent: the console keys them by (node, site, cidr). Added in v0.9.0.
  rpc ReportBans(ReportBansRequest) returns (ReportBansResponse);
  // GetChallengeKeys returns the HMAC secrets of challenge passes named by
  // NodeConfig.challenge_keys. Added in v0.10.0 (feature challenge-v1).
  rpc GetChallengeKeys(GetChallengeKeysRequest) returns (GetChallengeKeysResponse);
  // ReportSecurityEvents uploads CC mitigation events: level changes, attacked
  // paths and banned addresses. Idempotent by (node, event id). Added in
  // v0.10.0.
  rpc ReportSecurityEvents(ReportSecurityEventsRequest) returns (ReportSecurityEventsResponse);
}

// NodeInfo describes the host and software of a node.
message NodeInfo {
  string hostname = 1;
  string agent_version = 2;
  string os = 3;
  string arch = 4;
  // Data plane engine, e.g. "openresty".
  string engine = 5;
  string engine_version = 6;
  repeated string ip_addresses = 7;
  // Explicit capability negotiation also works for development builds.
  repeated string supported_features = 8;
}

// GetCertificatesRequest names certificate references from the desired revision.
message GetCertificatesRequest {
  repeated string ids = 1;
}

// CertificateMaterial contains secret key material, delivered over mTLS only.
message CertificateMaterial {
  string id = 1;
  string chain_pem = 2;
  string private_key_pem = 3;
  string sha256_fingerprint = 4;
}

// GetCertificatesResponse includes only material authorized by the node's cluster.
message GetCertificatesResponse {
  repeated CertificateMaterial certificates = 1;
}

// EnrollRequest carries the one-time token and the node's CSR.
message EnrollRequest {
  // Single-use enrollment token shown once in the console.
  string token = 1;
  // PEM-encoded PKCS#10 CSR. The private key never leaves the node.
  string csr_pem = 2;
  NodeInfo info = 3;
}

// EnrollResponse returns the node identity and its certificate.
message EnrollResponse {
  string node_id = 1;
  string cluster_id = 2;
  string node_name = 3;
  // PEM-encoded node certificate (client auth).
  string certificate_pem = 4;
  // PEM-encoded internal CA certificate; must match the pinned fingerprint.
  string ca_certificate_pem = 5;
  google.protobuf.Timestamp not_after = 6;
}

// RenewCertificateRequest carries a CSR for a new key pair.
message RenewCertificateRequest {
  string csr_pem = 1;
}

// RenewCertificateResponse returns the renewed certificate.
message RenewCertificateResponse {
  string certificate_pem = 1;
  string ca_certificate_pem = 2;
  google.protobuf.Timestamp not_after = 3;
}

// WatchConfigRequest opens a notification stream.
message WatchConfigRequest {
  // Revision the node has currently applied, 0 if none.
  uint64 known_revision = 1;
}

// WatchEvent is the kind of a WatchConfig message.
enum WatchEvent {
  WATCH_EVENT_UNSPECIFIED = 0;
  // A revision is available; fetch it with GetConfig if it is newer.
  WATCH_EVENT_REVISION = 1;
  // Keepalive so that both sides can detect dead streams.
  WATCH_EVENT_KEEPALIVE = 2;
  // Tasks are waiting for this node; fetch them with PullTasks.
  WATCH_EVENT_TASKS = 3;
  // Bans changed; fetch them with GetBans from the node's applied sequence.
  // Only sent to nodes that report bans-v1. Added in v0.9.0.
  WATCH_EVENT_BANS = 4;
}

// WatchConfigResponse notifies the node about the latest revision.
message WatchConfigResponse {
  WatchEvent event = 1;
  uint64 latest_revision = 2;
  string content_hash = 3;
  // Latest ban sequence of the node's cluster (WATCH_EVENT_BANS). Added in
  // v0.9.0.
  uint64 ban_sequence = 4;
}

// GetConfigRequest selects the revision to fetch.
message GetConfigRequest {
  // Revision to fetch; 0 means the latest.
  uint64 revision = 1;
  // Revision the node already has. When non-zero and still retained, the
  // console may answer with a diff instead of a snapshot.
  uint64 base_revision = 2;
}

// GetConfigResponse carries either a snapshot or a diff.
message GetConfigResponse {
  // Payload of the response.
  oneof payload {
    NodeConfig snapshot = 1;
    NodeConfigDiff diff = 2;
  }
  google.protobuf.Timestamp generated_at = 3;
  // Opaque console-authenticated proof of this node's issued revision.
  string revision_receipt = 4;
}

// ApplyState is the outcome of applying a revision on a node.
enum ApplyState {
  APPLY_STATE_UNSPECIFIED = 0;
  APPLY_STATE_APPLYING = 1;
  APPLY_STATE_APPLIED = 2;
  APPLY_STATE_FAILED = 3;
}

// ReportStatusRequest is sent after every apply and periodically.
message ReportStatusRequest {
  // Revision currently serving traffic.
  uint64 applied_revision = 1;
  string applied_content_hash = 2;
  ApplyState state = 3;
  // Human-readable detail, e.g. the nginx -t error on failure.
  string message = 4;
  NodeInfo info = 5;
  google.protobuf.Timestamp applied_at = 6;
  // Whether the data plane answered its local health probe.
  bool data_plane_healthy = 7;
  google.protobuf.Timestamp certificate_not_after = 8;
  // Passive health state of the origins this node has seen failing; origins
  // without failures may be omitted and count as healthy.
  repeated OriginHealth origin_health = 9;
  // Persisted with the LKG; authenticates higher revisions after a DB restore.
  string revision_receipt = 10;
  // State of the dynamic bans on this node; unset on nodes without bans-v1.
  // Added in v0.9.0.
  BanStatus bans = 11;
  // Current CC mitigation level of every site above normal or with escalated
  // paths. Added in v0.10.0; sites at normal with escalated paths since
  // v0.10.1 (earlier nodes leave them out).
  repeated SiteSecurity security = 12;
}

// SiteSecurity is the CC mitigation state of one site on one node.
message SiteSecurity {
  string site_id = 1;
  // normal, cookie302, js, pow or captcha; sites at normal without escalated
  // paths are left out.
  string level = 2;
  // Paths challenged above the site's level.
  uint32 escalated_paths = 3;
}

// BanStatus reports how the node holds the bans it received.
message BanStatus {
  // Highest ban sequence applied to the data plane.
  uint64 applied_sequence = 1;
  // Bans held by the data plane (console bans and the node's own).
  uint32 entries = 2;
  // Maximum number of bans the data plane holds.
  uint32 capacity = 3;
  // Manual bans the data plane could not hold, at most 100 ids. Manual bans
  // never fail silently: they stay here until they fit or expire.
  repeated string unapplied_ids = 4;
  // Number of manual bans that could not be held (may exceed the ids).
  uint32 unapplied = 5;
  // Platform bans held by the kernel (nftables); 0 without kernel-ban-v1.
  uint32 kernel_entries = 6;
  // Automatic bans dropped to make room, since the agent started.
  uint64 auto_evicted = 7;
}

// OriginHealth is the passive health state of one origin on one node.
message OriginHealth {
  string site_id = 1;
  string origin_id = 2;
  // False while the origin is marked down.
  bool healthy = 3;
  uint32 consecutive_failures = 4;
  google.protobuf.Timestamp last_failure_at = 5;
  // End of the current down period, unset while healthy.
  google.protobuf.Timestamp down_until = 6;
  // Short description of the last failure, e.g. "connect timeout".
  string last_error = 7;
  // Stable code of the last failure with its parameters: connect_failed,
  // timeout, upstream_status {status}, dns_failed {host},
  // address_forbidden {address}, tls_failed; empty for anything else. The
  // console localizes the code and falls back to last_error for codes it
  // does not know. Added in v0.2.1.
  string last_error_code = 8;
  map<string, string> last_error_params = 9;
}

// ReportStatusResponse tells the node what the console expects next.
message ReportStatusResponse {
  uint64 latest_revision = 1;
  // The console asks the node to renew its certificate.
  bool renew_certificate = 2;
  // Suggested heartbeat interval.
  uint32 report_interval_seconds = 3;
  // Tasks are waiting for this node (fallback for a missed watch event).
  bool tasks_pending = 4;
}

// MinuteStats is traffic of one site during one minute on one node.
message MinuteStats {
  // Start of the minute (UTC, seconds truncated).
  google.protobuf.Timestamp minute = 1;
  string site_id = 2;
  uint64 requests = 3;
  uint64 bytes_sent = 4;
  uint64 bytes_received = 5;
  uint64 cache_hits = 6;
  uint64 cache_misses = 7;
  // Response count per HTTP status code.
  map<uint32, uint64> status_codes = 8;
  repeated TopCounter top_urls = 9;
  repeated TopCounter top_ips = 10;
}

// TopCounter is a bounded, approximate heavy-hitter counter (no query strings).
message TopCounter {
  string value = 1;
  uint64 count = 2;
}

// ReportStatsRequest uploads a batch of minute buckets.
message ReportStatsRequest {
  repeated MinuteStats stats = 1;
  // Persisted monotonic counter. Zero queries the cursor when stats is empty;
  // zero with a non-empty legacy batch is rejected.
  uint64 batch_sequence = 2;
}

// ReportStatsResponse acknowledges a stats batch.
message ReportStatsResponse {
  uint32 accepted = 1;
  // Acknowledges this exact sequence, including already-accepted retries.
  uint64 batch_sequence = 2;
}

// ReportStatsV2Request is a sequenced batch or an empty cursor query.
message ReportStatsV2Request {
  repeated MinuteStats stats = 1;
  uint64 batch_sequence = 2;
  // The node's statistics watermark: every minute that starts before this
  // time is in this batch or in batches the console already acknowledged
  // (the drain boundary, a whole minute). Set on the last batch of a drain,
  // and on an empty cursor query (batch_sequence 0) once every batch is
  // acknowledged; unset leaves the console's value unchanged. The console
  // keeps the highest value it received. Added in v0.8.0.
  google.protobuf.Timestamp complete_until = 3;
}

// ReportStatsV2Response acknowledges the sequence (or returns the durable cursor).
message ReportStatsV2Response {
  uint32 accepted = 1;
  uint64 batch_sequence = 2;
}

// GetOriginCredentialsRequest names the credentials to fetch.
message GetOriginCredentialsRequest {
  // Ids from S3Auth.credential_id.
  repeated string ids = 1;
}

// OriginCredential is an access key pair for an S3-compatible origin.
message OriginCredential {
  string id = 1;
  // Matches S3Auth.credential_version of the configuration.
  uint64 version = 2;
  string access_key_id = 3;
  string secret_access_key = 4;
}

// GetOriginCredentialsResponse carries the credentials the node may use.
// Unknown ids and credentials of other clusters are left out.
message GetOriginCredentialsResponse {
  repeated OriginCredential credentials = 1;
}

// PullTasksRequest asks for pending tasks.
message PullTasksRequest {
  // Upper bound of tasks to return; 0 means the console's default.
  uint32 max_tasks = 1;
}

// PullTasksResponse carries pending tasks, oldest first.
message PullTasksResponse {
  repeated NodeTask tasks = 1;
}

// NodeTask is a typed one-off operation. Nodes never execute anything that
// is not one of these types.
message NodeTask {
  string id = 1;
  // Creation time; purge tasks use it as the purge epoch.
  google.protobuf.Timestamp created_at = 2;
  // What to do.
  oneof kind {
    PurgeTask purge = 3;
    PrefetchTask prefetch = 4;
    UpgradeTask upgrade = 5;
  }
}

// PurgeType is the scope of a purge target.
enum PurgeType {
  PURGE_TYPE_UNSPECIFIED = 0;
  // One URL (host, path and query), with every cache key variant of it.
  PURGE_TYPE_URL = 1;
  // Every URL of the host whose path starts with the given prefix.
  PURGE_TYPE_PREFIX = 2;
  // Every object of the site.
  PURGE_TYPE_SITE = 3;
}

// PurgeTarget is one thing to purge.
message PurgeTarget {
  string site_id = 1;
  PurgeType type = 2;
  // Lowercase host without port; empty for PURGE_TYPE_SITE.
  string host = 3;
  // URI path (URL) or path prefix (PREFIX) as requested, percent-encoded.
  string path = 4;
  // Raw query string of a URL target, without the "?".
  string query = 5;
}

// PurgeTask invalidates cached objects. Purged objects are never served
// again; their storage is reclaimed by the cache manager.
message PurgeTask {
  repeated PurgeTarget targets = 1;
}

// PrefetchTarget is one URL to load into the cache.
message PrefetchTarget {
  string site_id = 1;
  // Absolute http(s) URL whose host belongs to the site.
  string url = 2;
}

// PrefetchTask requests URLs through the node's own data plane so that the
// responses are cached.
message PrefetchTask {
  repeated PrefetchTarget targets = 1;
}

// TaskState is the outcome of a task on a node.
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_SUCCEEDED = 1;
  TASK_STATE_FAILED = 2;
}

// ReportTaskResultRequest reports the outcome of a task.
message ReportTaskResultRequest {
  string task_id = 1;
  TaskState state = 2;
  // Human-readable detail, e.g. the URLs that failed to prefetch.
  string message = 3;
  // Targets that succeeded and failed.
  uint32 succeeded = 4;
  uint32 failed = 5;
  google.protobuf.Timestamp finished_at = 6;
  // Stable code of the outcome when something failed, with its parameters:
  // prefetch_failed {failed, total, url, reason, status} (url is the first
  // failed URL; reason is status, connect_failed, timeout, https_unsupported
  // or other; status only with reason=status), prefetch_timeout {done,
  // total}, task_unsupported {type}, purge_failed. The console localizes the
  // code and falls back to message for codes it does not know. Added in
  // v0.2.1.
  string error_code = 7;
  map<string, string> error_params = 8;
}

// ReportTaskResultResponse acknowledges a task result.
message ReportTaskResultResponse {}

// AccessLog is a sampled request. Query strings, headers and bodies are excluded.
message AccessLog {
  google.protobuf.Timestamp time = 1;
  string site_id = 2;
  string client_ip = 3;
  string method = 4;
  string host = 5;
  string path = 6;
  uint32 status = 7;
  uint64 bytes_sent = 8;
  uint32 duration_ms = 9;
  string cache_status = 10;
  uint32 sample_rate = 11;
  // JA4 TLS client fingerprint, only when the site records it (log_ja4).
  // Added in v0.10.0.
  string ja4 = 12;
}
// ReportLogsRequest is an immutable, ordered batch from the private node spool.
message ReportLogsRequest {
  uint64 batch_sequence = 1;
  repeated AccessLog logs = 2;
}
// ReportLogsResponse acknowledges the batch, including already stored retries.
message ReportLogsResponse {
  uint64 batch_sequence = 1;
  uint32 accepted = 2;
}

// UpgradeTask selects one signed release. Trust roots and allowed download
// sources are configured on the node, never supplied by this task.
message UpgradeTask {
  string version = 1;
  string archive_url = 2;
  string sha256 = 3;
  string checksums_url = 4;
  string signature_url = 5;
}

// BanScope is where a ban applies.
enum BanScope {
  BAN_SCOPE_UNSPECIFIED = 0;
  // Every site of the node; also enforced by the kernel with kernel-ban-v1.
  BAN_SCOPE_PLATFORM = 1;
  // One site only (HTTP 403 at the edge layer).
  BAN_SCOPE_SITE = 2;
}

// BanSource tells who created a ban.
enum BanSource {
  BAN_SOURCE_UNSPECIFIED = 0;
  // An operator or a tenant.
  BAN_SOURCE_MANUAL = 1;
  // A node's automatic mitigation, shared with the cluster.
  BAN_SOURCE_AUTO = 2;
}

// Ban blocks a client address or prefix until it expires.
message Ban {
  string id = 1;
  // Canonical CIDR (host bits zero, lowercase IPv6), e.g. "203.0.113.7/32".
  // Prefixes are at least /16 (IPv4) or /48 (IPv6).
  string cidr = 2;
  BanScope scope = 3;
  // Site of a BAN_SCOPE_SITE ban; empty for platform bans.
  string site_id = 4;
  // At most 7 days after created_at.
  google.protobuf.Timestamp expires_at = 5;
  BanSource source = 6;
  // Reason code: abuse, attack, scanner, spam, other (manual) or cc_ip_rate
  // (automatic).
  string reason = 7;
  google.protobuf.Timestamp created_at = 8;
}

// GetBansRequest continues from the sequence the node has applied.
message GetBansRequest {
  // Highest sequence the node has applied; 0 asks for a full snapshot.
  uint64 after_sequence = 1;
  // Page size; 0 means the console's default. The console caps it.
  uint32 limit = 2;
}

// GetBansResponse is one page of ban changes in sequence order.
message GetBansResponse {
  // The node drops every console ban it holds before applying this page:
  // after_sequence was 0 or the console cannot continue from it (for
  // example after a database restore).
  bool reset = 1;
  // Bans added or changed after after_sequence, active ones only.
  repeated Ban bans = 2;
  // Bans removed after after_sequence (unbanned before they expired).
  repeated string removed_ids = 3;
  // Sequence this page reaches; the next request continues from it.
  uint64 sequence = 4;
  // More pages follow.
  bool more = 5;
}

// AutoBan is a ban a node created by itself.
message AutoBan {
  string site_id = 1;
  // A single address: "/32" or "/128".
  string cidr = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  // Reason code, e.g. cc_ip_rate.
  string reason = 5;
  // Trigger: metric (e.g. ip_qps), observed value, threshold and window.
  string metric = 6;
  double observed = 7;
  double threshold = 8;
  uint32 window_seconds = 9;
}

// ReportBansRequest uploads automatic bans, at most 1000 per request.
message ReportBansRequest {
  repeated AutoBan bans = 1;
}

// ReportBansResponse acknowledges the bans.
message ReportBansResponse {
  uint32 accepted = 1;
}

// GetChallengeKeysRequest names the keys to fetch.
message GetChallengeKeysRequest {
  // Ids from NodeConfig.challenge_keys.
  repeated string ids = 1;
}

// ChallengeKey is one HMAC-SHA256 key for challenge passes.
message ChallengeKey {
  string id = 1;
  // 32 random bytes.
  bytes secret = 2;
}

// GetChallengeKeysResponse carries the keys of the node's cluster; unknown
// ids and keys of other clusters are left out.
message GetChallengeKeysResponse {
  repeated ChallengeKey keys = 1;
}

// SecurityEventKind is what a CC mitigation event records.
enum SecurityEventKind {
  SECURITY_EVENT_KIND_UNSPECIFIED = 0;
  // The site's level changed.
  SECURITY_EVENT_KIND_SITE_LEVEL = 1;
  // An attacked path's level changed.
  SECURITY_EVENT_KIND_PATH_LEVEL = 2;
  // An address over the per-address rate was banned (see ReportBans).
  SECURITY_EVENT_KIND_IP_BANNED = 3;
}

// SecurityEvent is one CC mitigation decision of a node.
message SecurityEvent {
  // Unique per node; retries carry the same id.
  string id = 1;
  string site_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
  SecurityEventKind kind = 4;
  // Level after and before the change: normal, cookie302, js, pow, captcha.
  string level = 5;
  string previous_level = 6;
  // Path of a PATH_LEVEL event (no query string).
  string path = 7;
  // Address of an IP_BANNED event.
  string address = 8;
  // Trigger: site_qps, url_qps, ip_qps, origin_error_rate or cooldown, with
  // the observed value and the threshold.
  string metric = 9;
  double observed = 10;
  double threshold = 11;
  // Heaviest addresses and paths of the window (bounded, approximate).
  repeated TopCounter top_ips = 12;
  repeated TopCounter top_paths = 13;
}

// ReportSecurityEventsRequest uploads at most 500 events.
message ReportSecurityEventsRequest {
  repeated SecurityEvent events = 1;
}

// ReportSecurityEventsResponse acknowledges the events.
message ReportSecurityEventsResponse {
  uint32 accepted = 1;
}
