syntax = "proto3";

package edgeweir.node.v1;

import "google/protobuf/timestamp.proto";

// NodeConfig is the engine-agnostic intermediate representation (IR) that the
// console compiles from sites and rules. Nodes render it into their data plane
// (OpenResty today, possibly Pingora later). It never contains secrets inline:
// certificates and keys are referenced by id and fetched separately.
//
// Canonical form (required for content hashing):
//   - listeners sorted by port, cache_zones by name, sites by id,
//     certificates by id;
//   - inside a site: domains by name, origins by id, cache_rules by
//     (priority, id);
//   - offline_hosts by (name, wildcard), inside a site error_pages.pages by
//     status (v0.12.0);
//   - inside a site bulk_redirects by source; inside a rule action
//     set_query by name and remove_query sorted (v0.13.0);
//   - l4_apps by id, inside an application origins by id and
//     allow_list_ids / block_list_ids sorted and unique (v0.15.0); ids
//     compare by their UTF-8 bytes.
// content_hash is the lowercase hex SHA-256 of the deterministic binary
// encoding of this message with `revision` and `content_hash` cleared.
message NodeConfig {
  // Monotonically increasing revision within the cluster.
  uint64 revision = 1;
  // Hash of the canonical content, independent of the revision number.
  string content_hash = 2;
  // Cluster this configuration belongs to.
  string cluster_id = 3;
  // Ports the data plane listens on. Changing them is a structural change.
  repeated Listener listeners = 4;
  // Cache storage zones. Changing them is a structural change.
  repeated CacheZone cache_zones = 5;
  // Sites served by the cluster. Hot-updated without reloading the engine.
  repeated Site sites = 6;
  // TLS certificates referenced by sites.
  repeated CertificateRef certificates = 7;
  // CIDRs origins may use although they are special-purpose addresses
  // (loopback, link-local, private, CGNAT...), which nodes otherwise refuse
  // both as configured literals and as DNS answers. Set by the platform
  // administrator; empty by default. Added in v0.2.1.
  repeated string origin_allowed_cidrs = 8;
  // Feature identifiers every receiving agent must implement. Unknown features
  // reject the whole configuration and retain last-known-good.
  repeated string required_features = 9;
  // Short-lived public ACME HTTP-01 responses, hot-updated with the site table.
  repeated HttpChallenge http_challenges = 10;
  repeated IpList ip_lists = 11;
  repeated EdgeRule platform_rules = 12;
  // Platform-wide Under Attack. Added in v0.10.0 (feature challenge-v1).
  PlatformProtection platform_protection = 13;
  // Challenge pass keys of the cluster, sorted by id. Secrets are fetched
  // with GetChallengeKeys and never travel here. Added in v0.10.0. Since
  // v0.12.0 they also sign session affinity cookies (OriginPool.session_affinity).
  repeated ChallengeKeyRef challenge_keys = 14;
  // The platform's pages for hosts no site serves and for the offline hosts
  // below; unset, or an empty template, uses the node's built-in page.
  // Added in v0.12.0; older nodes ignore it (no feature required).
  PlatformErrorPages platform_error_pages = 15;
  // Domains of the cluster's sites that are disabled or suspended, sorted by
  // (name, wildcard). Such sites are not in `sites`; nodes answer their
  // hosts with the platform's page for the reason instead of the unknown
  // host page. Added in v0.12.0; older nodes ignore it (no feature required).
  repeated OfflineHost offline_hosts = 16;
  // Layer-4 (TCP / UDP) applications of the cluster, sorted by id; inside an
  // application origins by id and the list ids sorted and unique. Ports,
  // protocols, accept_proxy_protocol and proxy_protocol_version are
  // structural (rendered into stream {}, applied with a reload); everything
  // else is hot-updated. Added in v0.15.0 (feature l4-v1).
  repeated L4App l4_apps = 17;
}

// NodeConfigDiff transforms the config at base_revision into revision.
// Listeners, cache zones and certificates are small and always sent in full.
message NodeConfigDiff {
  // Revision the diff applies to.
  uint64 base_revision = 1;
  // Revision produced by applying the diff.
  uint64 revision = 2;
  // content_hash of the resulting NodeConfig, used to verify the result.
  string content_hash = 3;
  // Cluster this configuration belongs to.
  string cluster_id = 4;
  // Full listener set of the target revision.
  repeated Listener listeners = 5;
  // Full cache zone set of the target revision.
  repeated CacheZone cache_zones = 6;
  // Sites that were added or changed.
  repeated Site upserted_sites = 7;
  // Ids of sites that were removed.
  repeated string removed_site_ids = 8;
  // Full certificate reference set of the target revision.
  repeated CertificateRef certificates = 9;
  // Full origin allow list of the target revision (NodeConfig field 8).
  repeated string origin_allowed_cidrs = 10;
  repeated string required_features = 11;
  repeated HttpChallenge http_challenges = 12;
  repeated IpList ip_lists = 13;
  repeated EdgeRule platform_rules = 14;
  // Always sent in full, like listeners. Added in v0.10.0.
  PlatformProtection platform_protection = 15;
  repeated ChallengeKeyRef challenge_keys = 16;
  // Always sent in full (NodeConfig fields 15 and 16). Added in v0.12.0.
  PlatformErrorPages platform_error_pages = 17;
  repeated OfflineHost offline_hosts = 18;
  // Always sent in full (NodeConfig field 17). Added in v0.15.0.
  repeated L4App l4_apps = 19;
}

// L4Protocol is the transport of a layer-4 application.
enum L4Protocol {
  L4_PROTOCOL_UNSPECIFIED = 0;
  L4_PROTOCOL_TCP = 1;
  L4_PROTOCOL_UDP = 2;
}

// L4App forwards a TCP or UDP port of every node to its origins.
message L4App {
  string id = 1;
  L4Protocol protocol = 2;
  // 1024-65535; never a port of NodeConfig.listeners. Unique per protocol.
  uint32 port = 3;
  // TCP only: the listener expects a PROXY protocol header (v1 or v2).
  bool accept_proxy_protocol = 4;
  // TCP only: send a PROXY protocol header of this version to the origin
  // (0 none, 1 or 2).
  uint32 proxy_protocol_version = 5;
  // 1-32 origins.
  repeated L4Origin origins = 6;
  // Passive health check: consecutive connection failures that take an
  // origin out (1-100) and the seconds before it is tried again (1-3600).
  uint32 max_fails = 7;
  uint32 fail_timeout_seconds = 8;
  // Connect timeout towards the origin (100-60000 ms) and idle timeout of a
  // connection or UDP session (1-86400 s).
  uint32 connect_timeout_ms = 9;
  uint32 idle_timeout_seconds = 10;
  // Ids of NodeConfig.ip_lists: when allow lists are set only their
  // addresses are accepted; addresses of block lists are refused.
  repeated string allow_list_ids = 11;
  repeated string block_list_ids = 12;
  // Per node: concurrent connections or sessions and new ones per second;
  // 0 means no limit.
  uint32 max_connections = 13;
  uint32 new_connections_per_second = 14;
}

// L4Origin is one upstream of a layer-4 application.
message L4Origin {
  string id = 1;
  // Host name or IP literal; the origin address policy applies like for
  // sites (special-purpose addresses only inside origin_allowed_cidrs).
  string address = 2;
  uint32 port = 3;
  // 1-100.
  uint32 weight = 4;
  // Used only when every primary origin is down.
  bool backup = 5;
}

// ListenerProtocol is the application protocol of a listener.
enum ListenerProtocol {
  LISTENER_PROTOCOL_UNSPECIFIED = 0;
  LISTENER_PROTOCOL_HTTP = 1;
  LISTENER_PROTOCOL_HTTPS = 2;
}

// Listener is a port the data plane accepts traffic on.
message Listener {
  uint32 port = 1;
  ListenerProtocol protocol = 2;
  bool http2 = 3;
  bool http3 = 4;
  bool proxy_protocol = 5;
}

// CacheZone describes one on-disk cache with its in-memory key index.
message CacheZone {
  string name = 1;
  uint64 max_size_mb = 2;
  uint32 keys_zone_mb = 3;
  uint32 inactive_seconds = 4;
}

// Site is one customer property: a set of domains, an origin pool and rules.
message Site {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  repeated Domain domains = 4;
  OriginPool origin_pool = 5;
  repeated CacheRule cache_rules = 6;
  // Name of the cache zone the site stores objects in.
  string cache_zone = 7;
  // Bumped to invalidate every cached object of the site at once.
  uint64 cache_generation = 8;
  // Id of an entry in NodeConfig.certificates, empty for HTTP-only sites.
  string certificate_id = 9;
  // How cache keys are composed; unset means the default key (full query
  // string, host included, no request headers, cookies or device type).
  CacheKeyPolicy cache_key = 10;
  // Fetch and cache cacheable GET requests in fixed-size slices (1 MiB), so
  // that Range requests on large files are served from cached slices.
  bool range_slice = 11;
  // Reject WebSocket upgrades. WebSocket is proxied to the origin by default.
  bool websocket_disabled = 12;
  TlsOptions tls = 13;
  // Basis points, 0 disables sampled access logs, 10000 records every request.
  uint32 log_sample_rate = 15;
  repeated EdgeRule rules = 14;
  // Challenges and CC mitigation; unset means none. Added in v0.10.0
  // (feature challenge-v1).
  SiteProtection protection = 16;
  // OWASP CRS managed rules; unset means off. Added in v0.11.0 (feature
  // modsecurity-v1).
  SiteWaf waf = 17;
  // Forward the origin's Cache-Tag response header to clients. Off (the
  // default), the edge removes it; nodes index the tags of cached objects
  // either way (PURGE_TYPE_TAG). Added in v0.12.0; older nodes forward the
  // header (no feature required).
  bool keep_cache_tag = 18;
  // The site's error page templates; unset means the node's built-in pages.
  // Added in v0.12.0 (feature error-pages-v1).
  SiteErrorPages error_pages = 19;
  // Exact-match redirect table, at most 5000 entries sorted by source,
  // sources unique. Looked up after the redirect rules of the redirect
  // phase with the client's original Host and normalized path ($uri):
  // "host/path" first, then "/path". Added in v0.13.0 (feature rules-v2).
  repeated BulkRedirect bulk_redirects = 20;
}

// BulkRedirect is one entry of a site's exact-match redirect table.
message BulkRedirect {
  // "/path" (every domain of the site) or "host/path" (that lowercase host
  // only): 2-512 bytes without control characters, whitespace or "?".
  string source = 1;
  // Absolute http(s) URL or local path starting with a single "/", at most
  // 1024 bytes, like a static redirect rule.
  string target = 2;
  // 301, 302, 307 or 308.
  uint32 status_code = 3;
  // Append the request's query string to the target.
  bool preserve_query = 4;
}

// SiteErrorPages replaces the node's built-in error pages of a site: 403
// (denied by a rule, an IP list, a ban, the CRS or a missing challenge pass),
// 429 (rate limited), 502, 503 and 504 (origin unavailable or failing).
message SiteErrorPages {
  // At most one page per status, sorted by status. Statuses: 403, 429, 502,
  // 503 and 504; anything else rejects the configuration.
  repeated ErrorPage pages = 1;
  // Also replace error responses of the origin whose status has a page
  // (nginx's proxy_intercept_errors). Off, they reach the client unchanged.
  bool intercept_origin_errors = 2;
}

// ErrorPage is an HTML template of 1 to 65536 bytes. The placeholders
// {{status}}, {{request_id}}, {{client_ip}} and {{host}} are replaced with
// HTML-escaped values; any other text, including other {{...}}, is sent as
// it is. Pages are sent with Cache-Control: no-store.
message ErrorPage {
  uint32 status = 1;
  string template = 2;
}

// PlatformErrorPages are the platform administrator's templates, with the
// rules of ErrorPage. An empty template uses the node's built-in page.
message PlatformErrorPages {
  // Hosts no site of the cluster serves (status 404).
  string unknown_host = 1;
  // Offline hosts of disabled sites (status 503).
  string site_disabled = 2;
  // Offline hosts of suspended sites (status 503).
  string site_suspended = 3;
}

// OfflineHost is a domain of a site that is disabled or suspended.
message OfflineHost {
  // Lowercase host name; a wildcard stores its suffix like Domain.
  string name = 1;
  bool wildcard = 2;
  // disabled or suspended (suspended when both apply); anything else
  // rejects the configuration.
  string reason = 3;
}

// SiteWaf runs the OWASP Core Rule Set bundled with the node.
message SiteWaf {
  // detect (log only) or block; anything else rejects the configuration.
  string mode = 1;
  // Paranoia level 1-4.
  uint32 paranoia_level = 2;
  // Inbound anomaly score threshold, 1-1000 (CRS default 5).
  uint32 anomaly_threshold = 3;
  // CRS rule ids that never run for this site, sorted and unique.
  repeated uint32 excluded_rule_ids = 4;
  // Request body bytes inspected, 0-134217728; 0 inspects no body.
  uint32 request_body_limit = 5;
}

// SiteProtection holds a site's challenge and CC mitigation settings.
// Challenge types and levels are cookie302, js, pow and captcha (in rising
// strength); anything else rejects the configuration.
message SiteProtection {
  // Challenge every GET/HEAD request that carries no valid pass.
  bool under_attack = 1;
  // Challenge type of Under Attack.
  string under_attack_challenge = 2;
  // Lifetime of a pass, 300 to 86400 seconds.
  uint32 pass_ttl_seconds = 3;
  // Leading zero bits of the proof of work, and of the high-difficulty
  // proof of work that replaces the image captcha (accessible path, or
  // CcPolicy.high_pow_instead_of_captcha).
  uint32 pow_difficulty = 4;
  uint32 pow_high_difficulty = 5;
  CcPolicy cc = 6;
  // Record the JA4 fingerprint in sampled access logs (feature ja4-v1).
  bool log_ja4 = 7;
}

// CcPolicy raises the challenge level of a site or of attacked paths while
// a trigger holds, and bans addresses over their rate. Decisions are local
// to each node.
message CcPolicy {
  bool enabled = 1;
  // Highest level the policy may reach.
  string max_level = 2;
  // At the captcha level, challenge with the high-difficulty proof of work.
  bool high_pow_instead_of_captcha = 3;
  // Sliding window of every rate, in seconds.
  uint32 window_seconds = 4;
  // Thresholds in requests per second; 0 disables the trigger.
  uint32 site_qps = 5;
  uint32 url_qps = 6;
  uint32 ip_qps = 7;
  // Automatic ban (source auto, reason cc_ip_rate) of an address over ip_qps.
  uint32 ip_ban_seconds = 8;
  // Origin error rate (5xx and failed attempts) in percent, only counted
  // with at least origin_error_min_requests origin requests in the window.
  uint32 origin_error_percent = 9;
  uint32 origin_error_min_requests = 10;
  // A trigger that holds this long raises the level by one step.
  uint32 escalate_after_seconds = 11;
  // Without triggers for this long, the level falls by one step.
  uint32 cooldown_seconds = 12;
}

// PlatformProtection is set by platform administrators for every site.
message PlatformProtection {
  bool under_attack = 1;
  string under_attack_challenge = 2;
}

// ChallengeKeyRef names one HMAC key for challenge passes.
message ChallengeKeyRef {
  string id = 1;
  // next, current or previous. Nodes sign with current and accept all three.
  string role = 2;
}

// RuleExpression is a bounded, typed AST, never source code to execute.
//
// Since v0.13.0 (feature rules-v2) three more shapes exist: op "call" is a
// function call (field: the function name, value_type: its result type,
// children: the arguments), op "field" an argument that reads a field
// (field, value_type) and op "const" a string argument (value_type
// "string", value). A comparison whose left side is a function has an empty
// field and exactly one child, the value node. A boolean call may stand
// alone as a condition. Functions: lower, upper, len, starts_with,
// ends_with, url_decode and concat in conditions and value expressions;
// regex_replace and wildcard_replace in value expressions only (at most once
// each). Strings are byte strings; see the console's rule-engine package for
// the exact semantics and the shared test vectors.
message RuleExpression {
  string op = 1;
  string field = 2;
  string value_type = 3;
  string value = 4;
  repeated string values = 5;
  repeated RuleExpression children = 6;
}

// RuleAction contains only the arguments of the validated action kind.
message RuleAction {
  string kind = 1;
  string value = 2;
  string header = 3;
  uint32 status_code = 4;
  uint32 limit = 5;
  uint32 window_seconds = 6;
  string key = 7;
  optional bool cache_bypass = 8;
  optional bool force_https = 9;
  optional bool gzip = 10;
  bool remove = 11;
  // Challenge type of kind "challenge" (waf-custom): cookie302, js, pow or
  // captcha. Added in v0.10.0 (feature challenge-v1).
  string challenge = 12;
  // Fields 13-31 were added in v0.13.0 (feature rules-v2).
  //
  // Kind "config" (phase config only, except the three fields above):
  // compression switches among the codings the site enables (gzip = true
  // is accepted since v0.13.0); WebSocket upgrades; the site's Under
  // Attack; CC escalation and its highest level; origin timeouts in
  // milliseconds (0 keeps the site's; connect 100-120000, send and read
  // 100-3600000); the sampled access log rate in basis points (0-10000).
  optional bool brotli = 13;
  optional bool zstd = 14;
  optional bool websocket = 15;
  optional bool under_attack = 16;
  optional bool cc_enabled = 17;
  // cookie302, js, pow or captcha; empty keeps the site's.
  string cc_max_level = 18;
  uint32 origin_connect_timeout_ms = 19;
  uint32 origin_send_timeout_ms = 20;
  uint32 origin_read_timeout_ms = 21;
  optional uint32 log_sample_rate = 22;
  // Kinds "redirect" and "rewrite": a string value expression computed per
  // request instead of the static value (exactly one of both is set).
  RuleExpression target = 23;
  // Append (redirect) or keep (rewrite) the request's query string. Unset:
  // a redirect drops it, a rewrite keeps it.
  optional bool preserve_query = 24;
  // Query parameters set after removing those with the same name, sorted
  // by name, at most 16.
  repeated QueryParam set_query = 25;
  // Query parameter names removed, sorted and unique, at most 16.
  repeated string remove_query = 26;
  // Kind "origin" (phase origin): the site's origin group to use (empty
  // keeps the default group), the Host header and TLS SNI sent upstream and
  // the port of every origin of the group (0 keeps theirs). At least one is
  // set; later matching rules override field by field.
  string origin_group = 27;
  string host_header = 28;
  string sni = 29;
  uint32 port = 30;
  // Kind "compression" (phase compression): codings in preference order,
  // a subset of zstd, br and gzip; empty disables compression.
  repeated string compression = 31;
}

// QueryParam is one query parameter a redirect or rewrite sets. name:
// [A-Za-z0-9._~-]{1,64}; value: printable ASCII, at most 256 bytes,
// percent-encoded by the node (everything but RFC 3986 unreserved).
message QueryParam {
  string name = 1;
  string value = 2;
}

// EdgeRule is executed in list order inside its fixed phase. Phases, in
// order: request-transform, redirect, config, waf-custom, ratelimit, cache,
// origin, response-transform and, since v0.13.0 (feature rules-v2),
// compression (response fields available, like response-transform).
message EdgeRule {
  string id = 1;
  string phase = 2;
  RuleExpression expression = 3;
  RuleAction action = 4;
}

// IpList is a named collection or an automatically applied platform allow/block list.
message IpList {
  string id = 1;
  string name = 2;
  repeated string entries = 3;
  string kind = 4;
  bool platform = 5;
}

// HTTP and TLS policy. Cipher strings are never accepted from tenants.
message TlsOptions {
  bool force_https = 1;
  uint32 hsts_max_age = 2;
  bool hsts_include_subdomains = 3;
  bool hsts_preload = 4;
  string minimum_version = 5;
  bool http2 = 6;
  bool gzip = 7;
  uint32 gzip_min_length = 8;
  repeated string gzip_types = 9;
  bool ocsp_stapling = 10;
  string cipher_profile = 11;
  bool http3 = 12;
  // Brotli and Zstandard response compression (features brotli-v1 and
  // zstd-v1). Levels: brotli 0-11, zstd 1-19; 0 means the default (brotli
  // 6, zstd 3). Types are MIME types like gzip_types. Added in v0.11.0.
  bool brotli = 13;
  uint32 brotli_level = 14;
  uint32 brotli_min_length = 15;
  repeated string brotli_types = 16;
  bool zstd = 17;
  uint32 zstd_level = 18;
  uint32 zstd_min_length = 19;
  repeated string zstd_types = 20;
}

// An HTTP-01 response is public; private account and certificate keys are not IR.
message HttpChallenge {
  string domain = 1;
  string token = 2;
  string key_authorization = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// CacheKeyQuery selects which part of the query string enters the cache key.
enum CacheKeyQuery {
  // Same as CACHE_KEY_QUERY_ALL.
  CACHE_KEY_QUERY_UNSPECIFIED = 0;
  // The whole query string as sent by the client.
  CACHE_KEY_QUERY_ALL = 1;
  // No query string at all.
  CACHE_KEY_QUERY_IGNORE = 2;
  // Only the parameters listed in CacheKeyPolicy.query_params.
  CACHE_KEY_QUERY_INCLUDE = 3;
}

// CacheKeyPolicy describes the cache key of a site. Every request of the
// site uses the same policy, so that purging a URL covers all its variants.
message CacheKeyPolicy {
  CacheKeyQuery query = 1;
  // Parameter names kept by CACHE_KEY_QUERY_INCLUDE, sorted.
  repeated string query_params = 2;
  // Sort the kept parameters so that "?a=1&b=2" and "?b=2&a=1" share a key.
  bool sort_query = 3;
  // Lowercase request header names whose values enter the key, sorted.
  repeated string headers = 4;
  // Cookie names whose values enter the key, sorted.
  repeated string cookies = 5;
  // Separate mobile and desktop user agents.
  bool device_type = 6;
  // Leave the Host out of the key: all domains of the site share objects.
  bool exclude_host = 7;
}

// Domain is a host name routed to a site.
message Domain {
  // Lowercase host name without port, e.g. "a.example.com".
  string name = 1;
  // When true, name is a suffix and matches any single left-most label
  // ("*.example.com" is stored as name "example.com", wildcard true).
  bool wildcard = 2;
  // The site's certificate does not cover this domain yet (its ACME
  // certificate is being reissued for it): the domain is served over HTTP
  // only, with no certificate in the TLS handshake and no HTTPS redirect or
  // HSTS, until a revision without the flag. Only on sites with a
  // certificate. Added in v0.19.0 (feature tls-pending-domains-v1); the
  // console sends it only to clusters whose active nodes all report the
  // feature and otherwise leaves such domains out.
  bool tls_pending = 3;
}

// LoadBalancePolicy selects how an origin is picked from a pool.
enum LoadBalancePolicy {
  LOAD_BALANCE_POLICY_UNSPECIFIED = 0;
  LOAD_BALANCE_POLICY_WEIGHTED_RANDOM = 1;
  LOAD_BALANCE_POLICY_ROUND_ROBIN = 2;
  LOAD_BALANCE_POLICY_CONSISTENT_HASH = 3;
}

// OriginPool is the set of upstream servers of a site.
message OriginPool {
  string id = 1;
  LoadBalancePolicy policy = 2;
  repeated Origin origins = 3;
  // Skip certificate verification for HTTPS origins. Certificates are
  // verified against the system trust store by default.
  bool skip_tls_verify = 4;
  // Passive health checking of the origins.
  PassiveHealthCheck health_check = 5;
  // Connection reuse and timeouts towards the origins.
  OriginConnection connection = 6;
  // Active health checks, run by the agent of every node (feature
  // active-health-v1); unset means passive checks only. Added in v0.12.0.
  ActiveHealthCheck active_health_check = 7;
  // Cookie-based session affinity (feature session-affinity-v1); unset
  // means none. Added in v0.12.0.
  SessionAffinity session_affinity = 8;
}

// ActiveHealthCheck probes every origin of the pool from each node, honoring
// the origin address policy (special-purpose addresses outside
// NodeConfig.origin_allowed_cidrs are refused, also as DNS answers). An
// origin becomes unhealthy after unhealthy_threshold consecutive failed
// probes and healthy again after healthy_threshold consecutive successful
// ones. Merge with the passive check: an origin that either check marks
// down takes no traffic (passive marks last until their recovery time).
// S3-compatible origins are not probed.
message ActiveHealthCheck {
  // Absolute path with an optional query, e.g. "/healthz": 1-1024 bytes of
  // printable ASCII without spaces, starting with "/".
  string path = 1;
  // GET or HEAD.
  string method = 2;
  // Expected response status range, inclusive: 100 <= min <= max <= 599.
  uint32 expected_status_min = 3;
  uint32 expected_status_max = 4;
  // Host header of the probes; empty means the origin's host_header, else
  // its address.
  string host = 5;
  // Seconds between probes of an origin, 5-300.
  uint32 interval_seconds = 6;
  // Seconds a probe may take, 1-60 and at most interval_seconds.
  uint32 timeout_seconds = 7;
  // Consecutive results that change the state, 1-10 each.
  uint32 healthy_threshold = 8;
  uint32 unhealthy_threshold = 9;
}

// SessionAffinity pins a client to the origin that served it with the cookie
// "__ew_affinity": the origin id and an expiry signed with HMAC-SHA256 by the
// cluster's current challenge key (NodeConfig.challenge_keys, so every node
// of the cluster verifies it). A pinned origin that is down, no longer in the
// pool or outside the tier taking traffic (primaries, else backups) is
// replaced, and the cookie is issued again.
message SessionAffinity {
  // Lifetime of the cookie, 60-604800 seconds.
  uint32 ttl_seconds = 1;
}

// PassiveHealthCheck marks an origin down after consecutive failures seen by
// real traffic (connect errors, timeouts and 502/503/504 responses). Zero
// values use the node defaults (3 failures, 30 seconds).
message PassiveHealthCheck {
  // Consecutive failures that mark an origin down.
  uint32 max_fails = 1;
  // Seconds an origin stays down before traffic tries it again.
  uint32 recovery_seconds = 2;
}

// OriginConnection configures upstream connections. Zero values use the
// node defaults (connect 10 s, send 60 s, read 60 s, keep-alive 60 s and
// 1000 requests per connection).
message OriginConnection {
  uint32 connect_timeout_ms = 1;
  uint32 send_timeout_ms = 2;
  uint32 read_timeout_ms = 3;
  // Close upstream connections after every request.
  bool keepalive_disabled = 4;
  // Seconds an idle upstream connection stays in the pool.
  uint32 keepalive_idle_seconds = 5;
  // Requests served over one upstream connection before it is closed.
  uint32 keepalive_max_requests = 6;
}

// OriginScheme is the protocol used to talk to an origin.
enum OriginScheme {
  ORIGIN_SCHEME_UNSPECIFIED = 0;
  ORIGIN_SCHEME_HTTP = 1;
  ORIGIN_SCHEME_HTTPS = 2;
}

// Origin is one upstream server.
message Origin {
  string id = 1;
  // Host name or IP literal.
  string address = 2;
  uint32 port = 3;
  OriginScheme scheme = 4;
  // Relative weight inside the pool, at least 1.
  uint32 weight = 5;
  // Backup origins only receive traffic when all primaries are down.
  bool backup = 6;
  // Host header sent upstream; empty means forward the client Host.
  string host_header = 7;
  // TLS SNI for HTTPS origins; empty means derive from host_header/address.
  string sni = 8;
  // Sign requests with AWS Signature Version 4 (S3-compatible object
  // storage). Only GET and HEAD requests are forwarded to such origins.
  S3Auth s3 = 9;
  // Origin group inside the site, [a-z0-9_-]{1,32}; empty is the default
  // group. Only origin rules (RuleAction.origin_group) send traffic to the
  // other groups. Added in v0.13.0 (feature rules-v2).
  string group = 10;
}

// S3Auth references the credential used to sign requests to an S3-compatible
// origin. The secret itself is never part of the configuration; nodes fetch
// it with NodeService.GetOriginCredentials over mutual TLS.
message S3Auth {
  // Signing region, e.g. "us-east-1".
  string region = 1;
  // Bucket for path-style requests ("/<bucket>/<key>"); empty when the
  // origin address already names the bucket (virtual-hosted style).
  string bucket = 2;
  // Id of the credential to fetch.
  string credential_id = 3;
  // Changes whenever the credential changes, so that nodes fetch it again.
  uint64 credential_version = 4;
}

// CacheAction is what a matching cache rule does.
enum CacheAction {
  CACHE_ACTION_UNSPECIFIED = 0;
  CACHE_ACTION_CACHE = 1;
  CACHE_ACTION_BYPASS = 2;
}

// OriginCacheControl decides whether origin caching headers win.
enum OriginCacheControl {
  ORIGIN_CACHE_CONTROL_UNSPECIFIED = 0;
  // Use edge_ttl_seconds regardless of origin headers.
  ORIGIN_CACHE_CONTROL_OVERRIDE = 1;
  // Honour Cache-Control/Expires from the origin, falling back to
  // edge_ttl_seconds when the origin sends none.
  ORIGIN_CACHE_CONTROL_RESPECT = 2;
}

// CacheRule decides whether and for how long a response is cached.
// Rules are evaluated in (priority, id) order and the first match wins.
message CacheRule {
  string id = 1;
  uint32 priority = 2;
  CacheRuleMatch match = 3;
  CacheAction action = 4;
  uint32 edge_ttl_seconds = 5;
  OriginCacheControl origin_cache_control = 6;
  // Serve a stale object for this long after it expired while it is being
  // refreshed in the background (RFC 5861); 0 disables it.
  uint32 stale_while_revalidate_seconds = 7;
  // Serve a stale object for this long after it expired when the origin
  // fails (RFC 5861); 0 disables it.
  uint32 stale_if_error_seconds = 8;
  // Cache responses to requests that carry an Authorization header. Off
  // (the default), such requests bypass the cache and their responses are
  // never stored (RFC 9111 section 3.5). Added in v0.2.1; older agents
  // ignore it and keep their previous behavior.
  bool cache_authorized = 9;
  // Cache-Control: max-age=N towards clients for responses this rule
  // caches; 0 keeps the origin's header. At most 31536000. Added in v0.13.0
  // (feature rules-v2).
  uint32 browser_ttl_seconds = 10;
}

// CacheRuleMatch is the condition of a cache rule. Empty lists match all
// requests. When several conditions are set, all of them must match.
// Request conditions (paths, prefixes, extensions) are checked when the
// request arrives; response conditions (status codes, size) when the origin
// answers. A rule whose response conditions fail passes the decision on to
// the next rule whose request conditions matched.
message CacheRuleMatch {
  // URI path prefixes, e.g. "/static/".
  repeated string path_prefixes = 1;
  // File extensions without the dot, lowercase, e.g. "png".
  repeated string extensions = 2;
  // Reserved; nodes reject configs where this is non-empty. Expressions
  // travel as the typed `condition` below.
  string expression = 3;
  // Exact URI paths, e.g. "/index.html".
  repeated string paths = 4;
  // Response status codes, sorted; empty means any status the rule may cache.
  repeated uint32 status_codes = 5;
  // Minimum response size in bytes (Content-Length); 0 means no minimum.
  uint64 min_size_bytes = 6;
  // Maximum response size in bytes (Content-Length); 0 means no maximum.
  uint64 max_size_bytes = 7;
  // Request condition as a typed expression (phase cache), evaluated on the
  // client's original request before any rewrite, like the cache key. When
  // set, path_prefixes, paths and extensions are empty. Added in v0.13.0
  // (feature rules-v2).
  RuleExpression condition = 8;
}

// CertificateRef points at a certificate stored in the console.
message CertificateRef {
  string id = 1;
  repeated string names = 2;
  string sha256_fingerprint = 3;
  google.protobuf.Timestamp not_after = 4;
}
