syntax = "proto3";

package edgeweir.node.v1;

import "google/protobuf/timestamp.proto";

// NodeConfig is the engine-agnostic intermediate representation (IR) that the
// console compiles from sites and rules. Nodes render it into their data plane
// (OpenResty today, possibly Pingora later). It never contains secrets inline:
// certificates and keys are referenced by id and fetched separately.
//
// Canonical form (required for content hashing):
//   - listeners sorted by port, cache_zones by name, sites by id,
//     certificates by id;
//   - inside a site: domains by name, origins by id, cache_rules by
//     (priority, id);
//   - offline_hosts by (name, wildcard), inside a site error_pages.pages by
//     status (v0.12.0);
//   - inside a site bulk_redirects by source; inside a rule action
//     set_query by name and remove_query sorted (v0.13.0);
//   - l4_apps by id, inside an application origins by id and
//     allow_list_ids / block_list_ids sorted and unique (v0.15.0); ids
//     compare by their UTF-8 bytes;
//   - inside a site ports sorted and unique, inside its tls
//     redirect_excluded_domains sorted and unique; client_address
//     trusted_cidrs sorted and unique (v0.23.0);
//   - inside a cache zone node_sizes by node_id; inside a site's
//     maintenance allowed_cidrs and allowed_path_prefixes sorted and unique
//     (v0.24.0);
//   - inside a site domains, and offline_hosts, by (name, wildcard, match)
//     (v0.25.0; a name sorts before the same name with wildcard).
// content_hash is the lowercase hex SHA-256 of the deterministic binary
// encoding of this message with `revision` and `content_hash` cleared.
message NodeConfig {
  // Monotonically increasing revision within the cluster.
  uint64 revision = 1;
  // Hash of the canonical content, independent of the revision number.
  string content_hash = 2;
  // Cluster this configuration belongs to.
  string cluster_id = 3;
  // Ports the data plane listens on. Changing them is a structural change.
  repeated Listener listeners = 4;
  // Cache storage zones. Changing them is a structural change.
  repeated CacheZone cache_zones = 5;
  // Sites served by the cluster. Hot-updated without reloading the engine.
  repeated Site sites = 6;
  // TLS certificates referenced by sites.
  repeated CertificateRef certificates = 7;
  // CIDRs origins may use although they are special-purpose addresses
  // (loopback, link-local, private, CGNAT...), which nodes otherwise refuse
  // both as configured literals and as DNS answers. Set by the operator;
  // empty by default. Added in v0.2.1.
  repeated string origin_allowed_cidrs = 8;
  // Feature identifiers every receiving agent must implement. Unknown features
  // reject the whole configuration and retain last-known-good.
  repeated string required_features = 9;
  // Short-lived public ACME HTTP-01 responses, hot-updated with the site table.
  repeated HttpChallenge http_challenges = 10;
  repeated IpList ip_lists = 11;
  repeated EdgeRule platform_rules = 12;
  // Platform-wide Under Attack. Added in v0.10.0 (feature challenge-v1).
  PlatformProtection platform_protection = 13;
  // Challenge pass keys of the cluster, sorted by id. Secrets are fetched
  // with GetChallengeKeys and never travel here. Added in v0.10.0. Since
  // v0.12.0 they also sign session affinity cookies (OriginPool.session_affinity).
  repeated ChallengeKeyRef challenge_keys = 14;
  // The platform's pages for hosts no site serves and for the offline hosts
  // below; unset, or an empty template, uses the node's built-in page.
  // Added in v0.12.0; older nodes ignore it (no feature required).
  PlatformErrorPages platform_error_pages = 15;
  // Domains of the cluster's disabled sites, sorted by (name, wildcard).
  // Such sites are not in `sites`; nodes answer their hosts with the
  // platform's page for the reason instead of the unknown host page.
  // Added in v0.12.0; older nodes ignore it (no feature required).
  repeated OfflineHost offline_hosts = 16;
  // Layer-4 (TCP / UDP) applications of the cluster, sorted by id; inside an
  // application origins by id and the list ids sorted and unique. Ports,
  // protocols, accept_proxy_protocol and proxy_protocol_version are
  // structural (rendered into stream {}, applied with a reload); everything
  // else is hot-updated. Added in v0.15.0 (feature l4-v1).
  repeated L4App l4_apps = 17;
  // How the edge layer's HTTP and HTTPS listeners find the client address
  // (ip.src, $remote_addr: bans, CC, rules, logs, X-Real-IP towards the
  // origins). Unset: the TCP peer, for QUIC the UDP peer. Added in v0.23.0
  // (feature client-ip-v1).
  ClientAddress client_address = 18;
  // How the nodes answer hosts no site serves and requests by node IP.
  // Unset: the platform's unknown host page (HTTPS: an aborted handshake
  // for unknown SNI, 421 without SNI), no scan protection. Added in v0.25.0
  // (feature unknown-host-v1).
  UnknownHosts unknown_hosts = 19;
  // TLS session ticket keys of the cluster, sorted by id: nodes encrypt
  // tickets with current and decrypt with all three. Secrets are fetched
  // with NodeService.GetSessionTicketKeys and never travel here. Present
  // when the cluster serves a site with a certificate. Added in v0.26.0;
  // older nodes ignore it and resume no sessions (no feature required).
  repeated SessionTicketKeyRef session_ticket_keys = 20;
}

// UnknownHosts is the cluster's handling of requests no site serves.
//
// unknown_host applies to a Host no site (nor offline host) serves and to
// a site's host on a port the site is not bound to (Site.ports); ip_access
// to a Host that is an IP literal (IPv4, or IPv6 in brackets) or empty or
// missing. Values: "page": the platform's unknown host page (404; over
// HTTPS without SNI ip_access keeps 421); "close": the connection is closed
// without a response (444); "site": the request is served by the site
// default_site_id when it is in `sites` and bound to the request's port,
// else as "page". Hosts of disabled sites (offline_hosts) keep their page.
// Anything else rejects the configuration.
//
// default_certificate (unknown_host "site" only): a TLS handshake whose
// SNI no site serves completes with the default site's certificate; the
// request then follows its Host. Without it, or when the default site has
// no certificate or is not bound to the port, such handshakes are aborted.
// Connections without SNI keep the node's health certificate.
//
// scan_threshold > 0 (10-10000) turns on scan protection: a client address
// (ip.src) whose requests reach the unknown_host or ip_access handling, in
// any of its forms, more than scan_threshold times within 60 seconds
// (counted from the first) is banned at platform scope for
// scan_ban_seconds (60-86400): the node holds the ban and reports it
// (ReportBans: AutoBan.scope BAN_SCOPE_PLATFORM, reason unknown_host_scan,
// metric unknown_host_requests). Loopback addresses, trusted proxies
// (ClientAddress.trusted_cidrs) and addresses the platform rules allow are
// never banned. TLS handshakes aborted for unknown SNI are not counted.
message UnknownHosts {
  string unknown_host = 1;
  string ip_access = 2;
  string default_site_id = 3;
  bool default_certificate = 4;
  uint32 scan_threshold = 5;
  uint32 scan_ban_seconds = 6;
}

// ClientAddress is the cluster's client address setting.
//
// mode "proxy_protocol": every TCP listener of NodeConfig.listeners has
// proxy_protocol set and refuses connections without a PROXY protocol
// header (v1 or v2); the header's source address is the client's (UNKNOWN:
// the TCP peer). QUIC (HTTP/3) has no PROXY protocol: the UDP peer.
//
// mode "header": peers inside trusted_cidrs are proxies whose header names
// the client; nginx's realip module reads it (real_ip_recursive on): for
// x-forwarded-for, from right to left past trusted addresses; a value that
// is no IP address leaves the TCP peer. Peers outside keep their own
// address. Trusted addresses are never banned and not counted per address
// by CC.
//
// mode "direct" (only with drop_forwarded_for): the TCP peer.
//
// The edge sends X-Real-IP: the client address, and X-Forwarded-For: the
// received header followed by the TCP peer (direct mode: the client
// address, which is the TCP peer; drop_forwarded_for: the TCP peer only).
// ip.peer is the TCP (QUIC: UDP) peer in every mode.
message ClientAddress {
  string mode = 1;
  // mode "header": 1-64 CIDRs in canonical form (IPv4 a.b.c.d/n, IPv6
  // compressed lowercase), sorted and unique.
  repeated string trusted_cidrs = 2;
  // mode "header": the lowercase header name: x-forwarded-for, x-real-ip,
  // cf-connecting-ip, true-client-ip or another token of 1-64 characters
  // [a-z0-9-] (never a pseudo or hop-by-hop header, nor x-edgeweir-*).
  string header = 3;
  // mode "direct": X-Forwarded-For towards the origins is the TCP peer
  // alone; the client's own X-Forwarded-For is dropped.
  bool drop_forwarded_for = 4;
}

// NodeConfigDiff transforms the config at base_revision into revision.
// Listeners, cache zones and certificates are small and always sent in full.
message NodeConfigDiff {
  // Revision the diff applies to.
  uint64 base_revision = 1;
  // Revision produced by applying the diff.
  uint64 revision = 2;
  // content_hash of the resulting NodeConfig, used to verify the result.
  string content_hash = 3;
  // Cluster this configuration belongs to.
  string cluster_id = 4;
  // Full listener set of the target revision.
  repeated Listener listeners = 5;
  // Full cache zone set of the target revision.
  repeated CacheZone cache_zones = 6;
  // Sites that were added or changed.
  repeated Site upserted_sites = 7;
  // Ids of sites that were removed.
  repeated string removed_site_ids = 8;
  // Full certificate reference set of the target revision.
  repeated CertificateRef certificates = 9;
  // Full origin allow list of the target revision (NodeConfig field 8).
  repeated string origin_allowed_cidrs = 10;
  repeated string required_features = 11;
  repeated HttpChallenge http_challenges = 12;
  repeated IpList ip_lists = 13;
  repeated EdgeRule platform_rules = 14;
  // Always sent in full, like listeners. Added in v0.10.0.
  PlatformProtection platform_protection = 15;
  repeated ChallengeKeyRef challenge_keys = 16;
  // Always sent in full (NodeConfig fields 15 and 16). Added in v0.12.0.
  PlatformErrorPages platform_error_pages = 17;
  repeated OfflineHost offline_hosts = 18;
  // Always sent in full (NodeConfig field 17). Added in v0.15.0.
  repeated L4App l4_apps = 19;
  // Always sent in full (NodeConfig field 18). Added in v0.23.0.
  ClientAddress client_address = 20;
  // Always sent in full (NodeConfig field 19). Added in v0.25.0.
  UnknownHosts unknown_hosts = 21;
  // Always sent in full (NodeConfig field 20). Added in v0.26.0.
  repeated SessionTicketKeyRef session_ticket_keys = 22;
}

// L4Protocol is the transport of a layer-4 application.
enum L4Protocol {
  L4_PROTOCOL_UNSPECIFIED = 0;
  L4_PROTOCOL_TCP = 1;
  L4_PROTOCOL_UDP = 2;
}

// L4App forwards a TCP or UDP port of every node to its origins.
message L4App {
  string id = 1;
  L4Protocol protocol = 2;
  // 1024-65535; never a port of NodeConfig.listeners. Unique per protocol.
  uint32 port = 3;
  // TCP only: the listener expects a PROXY protocol header (v1 or v2).
  bool accept_proxy_protocol = 4;
  // TCP only: send a PROXY protocol header of this version to the origin
  // (0 none, 1 or 2).
  uint32 proxy_protocol_version = 5;
  // 1-32 origins.
  repeated L4Origin origins = 6;
  // Passive health check: consecutive connection failures that take an
  // origin out (1-100) and the seconds before it is tried again (1-3600).
  uint32 max_fails = 7;
  uint32 fail_timeout_seconds = 8;
  // Connect timeout towards the origin (100-60000 ms) and idle timeout of a
  // connection or UDP session (1-86400 s).
  uint32 connect_timeout_ms = 9;
  uint32 idle_timeout_seconds = 10;
  // Ids of NodeConfig.ip_lists: when allow lists are set only their
  // addresses are accepted; addresses of block lists are refused.
  repeated string allow_list_ids = 11;
  repeated string block_list_ids = 12;
  // Per node: concurrent connections or sessions and new ones per second;
  // 0 means no limit.
  uint32 max_connections = 13;
  uint32 new_connections_per_second = 14;
  // Last port of the range port..port_end (port_end > port, at most 1000
  // ports, unique per protocol like port); 0: the single port. Added in
  // v0.23.0 (feature l4-v2).
  uint32 port_end = 15;
  // TCP only: the node terminates TLS with this certificate (an id of
  // NodeConfig.certificates) and forwards the plain bytes. The handshake's
  // SNI must be one of the certificate's names (a wildcard name covers one
  // left-most label); a handshake without SNI gets the certificate too.
  // Empty: plain TCP. Added in v0.23.0 (feature l4-v2).
  string certificate_id = 16;
  // With certificate_id: "1.2" (TLS 1.2 and 1.3) or "1.3".
  string tls_minimum_version = 17;
}

// L4Origin is one upstream of a layer-4 application.
message L4Origin {
  string id = 1;
  // Host name or IP literal; the origin address policy applies like for
  // sites (special-purpose addresses only inside origin_allowed_cidrs).
  string address = 2;
  // 1-65535; since v0.23.0 (feature l4-v2) 0: the port the connection or
  // session arrived on (for port ranges).
  uint32 port = 3;
  // 1-100.
  uint32 weight = 4;
  // Used only when every primary origin is down.
  bool backup = 5;
}

// ListenerProtocol is the application protocol of a listener.
enum ListenerProtocol {
  LISTENER_PROTOCOL_UNSPECIFIED = 0;
  LISTENER_PROTOCOL_HTTP = 1;
  LISTENER_PROTOCOL_HTTPS = 2;
}

// Listener is a port the data plane accepts traffic on.
message Listener {
  // 1-65535. Since v0.23.0 (feature edge-ports-v1) a cluster may have
  // listeners besides 80 (HTTP) and 443 (HTTPS); sites name theirs in
  // Site.ports. Port 80 always answers ACME HTTP-01 challenges.
  uint32 port = 1;
  ListenerProtocol protocol = 2;
  bool http2 = 3;
  bool http3 = 4;
  bool proxy_protocol = 5;
}

// CacheZone describes one on-disk cache with its in-memory key index.
// Changing max_size_mb, keys_zone_mb or inactive_seconds rewrites
// proxy_cache_path: a structural change (reload).
message CacheZone {
  string name = 1;
  uint64 max_size_mb = 2;
  uint32 keys_zone_mb = 3;
  uint32 inactive_seconds = 4;
  // Per-node sizes replacing max_size_mb and keys_zone_mb on the node whose
  // id they name, sorted by node_id and unique; a node without an entry
  // uses the zone's sizes. Added in v0.24.0 (feature cache-zone-v1).
  repeated CacheZoneNodeSize node_sizes = 5;
}

// CacheZoneNodeSize is the size of a cache zone on one node.
message CacheZoneNodeSize {
  string node_id = 1;
  // 1024-67108864 (1 GiB-64 TiB).
  uint64 max_size_mb = 2;
  // 16-512.
  uint32 keys_zone_mb = 3;
}

// Site is one property: a set of domains, an origin pool and rules.
message Site {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  repeated Domain domains = 4;
  OriginPool origin_pool = 5;
  repeated CacheRule cache_rules = 6;
  // Name of the cache zone the site stores objects in.
  string cache_zone = 7;
  // Bumped to invalidate every cached object of the site at once.
  uint64 cache_generation = 8;
  // Id of an entry in NodeConfig.certificates, empty for HTTP-only sites.
  string certificate_id = 9;
  // How cache keys are composed; unset means the default key (full query
  // string, host included, no request headers, cookies or device type).
  CacheKeyPolicy cache_key = 10;
  // Fetch and cache cacheable GET requests in fixed-size slices (1 MiB), so
  // that Range requests on large files are served from cached slices.
  bool range_slice = 11;
  // Reject WebSocket upgrades. WebSocket is proxied to the origin by default.
  bool websocket_disabled = 12;
  TlsOptions tls = 13;
  // Basis points, 0 disables sampled access logs, 10000 records every request.
  uint32 log_sample_rate = 15;
  repeated EdgeRule rules = 14;
  // Challenges and CC mitigation; unset means none. Added in v0.10.0
  // (feature challenge-v1).
  SiteProtection protection = 16;
  // OWASP CRS managed rules; unset means off. Added in v0.11.0 (feature
  // modsecurity-v1).
  SiteWaf waf = 17;
  // Forward the origin's Cache-Tag response header to clients. Off (the
  // default), the edge removes it; nodes index the tags of cached objects
  // either way (PURGE_TYPE_TAG). Added in v0.12.0; older nodes forward the
  // header (no feature required).
  bool keep_cache_tag = 18;
  // The site's error page templates; unset means the node's built-in pages.
  // Added in v0.12.0 (feature error-pages-v1).
  SiteErrorPages error_pages = 19;
  // Exact-match redirect table, at most 5000 entries sorted by source,
  // sources unique. Looked up after the redirect rules of the redirect
  // phase with the client's original Host and normalized path ($uri):
  // "host/path" first, then "/path". Added in v0.13.0 (feature rules-v2).
  repeated BulkRedirect bulk_redirects = 20;
  // Ports of NodeConfig.listeners the site is served on, sorted and
  // unique; HTTPS ones only with a certificate. A request on another
  // listener, and a TLS handshake there, is treated like one for an unknown
  // host (404 page; the handshake is aborted). Empty: every listener
  // (configurations without feature edge-ports-v1). Added in v0.23.0
  // (feature edge-ports-v1).
  repeated uint32 ports = 21;
  // Fields 22-26 were added in v0.24.0 (feature site-content-v1).
  //
  // Purge cached URLs with the PURGE method: a PURGE request carrying the
  // key in X-Purge-Key makes the node submit a URL purge of the cluster
  // (NodeService.SubmitPurge). Unset: PURGE requests go to the origin like
  // any other method.
  PurgeMethod purge = 22;
  // Send no X-Cache header to clients.
  bool hide_x_cache = 23;
  // Maintenance mode; unset means off.
  Maintenance maintenance = 24;
  // Charset parameter of text responses; unset means off.
  Charset charset = 25;
  // Largest request body by Content-Length, in bytes; unset means 104857600
  // (100 MiB), 0 no limit, at most 10737418240 (10 GiB). Requests over it
  // get 413. Config rules may override it (RuleAction.request_body_limit).
  optional uint64 request_body_limit = 26;
  // Further certificates of the site after certificate_id, at most 3, in
  // the site's order, ids of NodeConfig.certificates distinct from
  // certificate_id; empty without certificate_id. Every domain is covered by
  // at least one of them; the handshake uses the one covering the SNI,
  // exact names over wildcards, ECDSA when the client supports it, else the
  // first. Added in v0.26.0 (feature multi-certificate-v1).
  repeated string additional_certificate_ids = 27;
  // Client certificates (mutual TLS) on the site's HTTPS listeners; unset
  // means off. Needs certificate_id. Added in v0.26.0 (feature
  // client-cert-v1).
  ClientCertificate client_certificate = 28;
  // Access authentication rules in their order: a request is checked by the
  // first enabled rule whose scope it matches, before the rule phases and the
  // cache lookup (Basic, forward authentication or signed URLs). Disabled
  // rules are left out. Added in v0.27.0 (feature access-auth-v1).
  repeated AuthRule auth_rules = 29;
  // Access control: site lists, geo, CORS, hotlink, user agents, WebSocket
  // origins and idle timeout, security response headers (ADR-0039). Unset:
  // none of them. Added in v0.28.0 (feature access-control-v1).
  AccessControl access_control = 30;
  // Largest request body, by Content-Length, the rules read (the
  // http.request.body.* fields, form_value and json_value): 1024-1048576;
  // 0 means 65536. Set only when the site's rules or the platform rules
  // read the body; other requests and sites never read it. Added in v0.29.0
  // (feature rules-body-v1).
  uint32 rules_body_limit = 31;
  // Access log options, all off by default (ADR-0041). Added in v0.30.0
  // (feature access-logs-v2).
  // log_blocked: requests with a block reason (blocked, challenged or
  // refused by access authentication) always get a line, sample rate 10000;
  // with the lines of log rules at most 100 per site and second on a node.
  bool log_blocked = 32;
  // log_query: lines carry the query string (AccessLog.query).
  bool log_query = 33;
  // log_headers: request headers lines carry (AccessLog.headers): at most 8
  // lowercase names, never authorization, cookie or proxy-authorization.
  repeated string log_headers = 34;
  // log_peer: lines carry the connection's peer address when it differs
  // from the client address (AccessLog.peer_ip).
  bool log_peer = 35;
  // WebP / AVIF conversion of cached JPEG and PNG responses by the request's
  // Accept (ADR-0043); unset means off. Added in v0.31.0 (feature
  // image-convert-v1).
  ImageConvert image_convert = 36;
}

// ImageConvert turns cached JPEG and PNG responses into WebP or AVIF for
// clients that accept them: the edge picks avif, webp or the original from
// Accept (explicit image/avif or image/webp with q > 0), keys the cache by
// that class, converts on a miss and keeps the original whenever the
// conversion fails, is over a limit or would not be smaller. Only requests
// that are cached (a cache rule applies) are converted.
message ImageConvert {
  // Formats offered, at least one.
  bool webp = 1;
  bool avif = 2;
  // Encoder quality, 1-100.
  uint32 webp_quality = 3;
  uint32 avif_quality = 4;
  // Source types converted, at least one: image/jpeg and image/png.
  bool jpeg = 5;
  bool png = 6;
  // Responses of min_size to max_size bytes are converted: max_size
  // 1-67108864, min_size at most max_size.
  uint64 min_size = 7;
  uint64 max_size = 8;
  // Largest image converted, in pixels: 1-50000000.
  uint64 max_pixels = 9;
}

// AuthKind is how an access authentication rule checks a request.
enum AuthKind {
  AUTH_KIND_UNSPECIFIED = 0;
  // HTTP Basic authentication against the rule's users.
  AUTH_KIND_BASIC = 1;
  // A subrequest to an authentication service decides.
  AUTH_KIND_FORWARD = 2;
  // Signed URLs: path?sign=ts-rand-md5(path@ts@rand@key).
  AUTH_KIND_URL_A = 3;
  // Signed URLs: /ts/md5(path@ts@key)/path.
  AUTH_KIND_URL_B = 4;
  // Signed URLs: /md5(path@ts@key)/ts/path.
  AUTH_KIND_URL_C = 5;
  // Signed URLs: path?sign=md5(path@ts@key)&t=ts.
  AUTH_KIND_URL_D = 6;
}

// AuthRule is a site's access authentication rule. Its scope lists are
// sorted; empty lists do not narrow the scope. Basic users with their
// password hashes and URL signing keys are never part of the configuration:
// nodes fetch them with NodeService.GetOriginCredentials (an
// OriginCredential with id credential_id) and keep them in the agent's state
// directory.
message AuthRule {
  string id = 1;
  AuthKind kind = 2;
  // Site domains in their written form (a.com, *.a.com, .a.com, ~pattern),
  // each matched against the request's Host as the site matches it.
  repeated string domains = 3;
  // Path prefixes ("/..."): the request's path starts with one of them.
  repeated string path_prefixes = 4;
  // Lowercase extensions without the dot (as
  // http.request.uri.path.extension).
  repeated string extensions = 5;
  // Path prefixes the rule leaves alone.
  repeated string exclude_path_prefixes = 6;
  // The rule's secret (Basic, URL kinds); credential_version changes
  // whenever the secret does, so that nodes fetch it again.
  string credential_id = 7;
  uint64 credential_version = 8;
  // Exactly one of these, by kind.
  BasicAuth basic = 9;
  ForwardAuth forward = 10;
  UrlAuth url = 11;
}

// BasicAuth holds the settings of a Basic rule. The secret is
// {"users":[{"name":..,"hash":"pbkdf2-sha256$<iterations>$<salt hex>$<hash
// hex>"}]}.
message BasicAuth {
  // Sent in WWW-Authenticate.
  string realm = 1;
  // Keep the Authorization header towards the origin (default: removed).
  bool keep_authorization = 2;
  // Send X-Auth-User with the user name to the origin.
  bool user_header = 3;
}

// ForwardAuth holds the settings of a forward authentication rule. The node
// sends the subrequest through its origin layer, under the origin address
// policy.
message ForwardAuth {
  // http(s) URL of the authentication service (no user information).
  string url = 1;
  // HEAD instead of GET.
  bool head = 2;
  // 100-10000.
  uint32 timeout_ms = 3;
  // Request headers forwarded from the visitor (lowercase names), besides
  // X-Original-URI, X-Original-Method, X-Original-Host, X-Real-IP and
  // X-Forwarded-For.
  repeated string request_headers = 4;
  // Headers of a 2xx answer copied to the request towards the origin
  // (lowercase names); absent ones are removed from it.
  repeated string response_headers = 5;
  // Cache 2xx, 401 and 403 answers for this long (0: off, at most 300), keyed
  // by the forwarded request headers.
  uint32 cache_seconds = 6;
  // Pass 3xx answers on to the visitor (login redirects); otherwise they deny.
  bool pass_redirects = 7;
  // When the service fails (5xx, connection errors, timeouts), let the
  // request through instead of answering 503.
  bool allow_unavailable = 8;
}

// UrlAuth holds the settings of a signed URL rule (kinds A-D). The secret is
// {"keys":["primary"(,"backup")]}; a signature of either key is accepted.
message UrlAuth {
  // A signature is valid from ts - skew_seconds to ts + validity_seconds +
  // skew_seconds. validity 1-31536000, skew 0-600.
  uint32 validity_seconds = 1;
  uint32 skew_seconds = 2;
  // Query parameter of the signature (A, D) and of the timestamp (D);
  // [A-Za-z0-9_-]{1,32}.
  string sign_param = 3;
  string time_param = 4;
}

// AccessControl is a site's access control (ADR-0039), checked at the edge
// before access authentication and the rule phases, so cache hits too:
// site block lists, geo, CORS preflights, hotlink, user agents. Every part
// is optional and present only when used. Path prefixes start with "/",
// are at most 1024 bytes without "?", "#" and control characters and match
// the normalized path ($uri, a signed URL's signature removed) bytewise;
// at most 32 per list. Added in v0.28.0 (feature access-control-v1).
message AccessControl {
  // Ids of NodeConfig.ip_lists, at most 16 each, disjoint. ip.src on a
  // block list gets 403 (ip-blocked) unless it is on a platform allow list
  // or on one of the site's allow lists. ip.src on an allow list skips the
  // site's bans and block lists, geo, hotlink and user agent checks, CC
  // bans and Under Attack and CC challenges; never platform block lists and
  // bans, CORS, WebSocket origins, access authentication or rules.
  repeated string block_list_ids = 1;
  repeated string allow_list_ids = 2;
  Hotlink hotlink = 3;
  UserAgentRules user_agents = 4;
  Cors cors = 5;
  GeoAccess geo = 6;
  WebSocketAccess websocket = 7;
  SecurityHeaders security_headers = 8;
}

// Hotlink protection by Referer (and Origin): requests in scope whose
// source is not allowed get 403 (hotlink-denied) or a 302 to redirect_url.
// Host forms: "a.com" (exact), "*.a.com" (one label below a.com), ".a.com"
// (any depth below a.com, not a.com itself), "*" (any host); lowercase.
message Hotlink {
  // Requests with neither value (an empty or missing Referer, and Origin
  // when checked) pass.
  bool allow_empty = 1;
  // Hosts the node resolves to this site pass.
  bool allow_site_domains = 2;
  // At most 200 each; a denied host never passes.
  repeated string allowed = 3;
  repeated string denied = 4;
  // Also check a non-empty Origin header.
  bool check_origin = 5;
  // Requests in scope: extension in extensions (lowercase, no dot, at most
  // 64) or path under path_prefixes; both empty: every request; minus
  // exclude_path_prefixes.
  repeated string extensions = 6;
  repeated string path_prefixes = 7;
  repeated string exclude_path_prefixes = 8;
  // Empty: 403. Else a site path ("/..." not "//...") or an http(s) URL
  // without credentials, whitespace, control characters or backslashes, at
  // most 2048 characters; requests for that site path itself are not
  // checked.
  string redirect_url = 9;
}

// UserAgentRule is a user agent pattern: the rule engine's wildcard (whole
// value, "*" any bytes (at most 8), "\*" and "\\" literals, ASCII case
// insensitive), 0-512 printable ASCII bytes; "" matches an empty or missing
// User-Agent.
message UserAgentRule {
  string pattern = 1;
  // true: allow, false: deny.
  bool allow = 2;
}

// UserAgentRules: a request in scope whose User-Agent matches an allow rule
// passes; else one matching a deny rule gets 403 (ua-denied).
message UserAgentRules {
  // 1-200, in the operator's order.
  repeated UserAgentRule rules = 1;
  repeated string path_prefixes = 2;
  repeated string exclude_path_prefixes = 3;
}

// Cors answers preflights at the edge and sets CORS response headers on
// requests in scope (path_prefixes, empty: every path). Origin forms:
// "scheme://host[:port]" (http or https, lowercase host, the default port
// left out), the host may start with "*." (one label), or "*" alone.
message Cors {
  // 1-100. "*" only without allow_credentials.
  repeated string allowed_origins = 1;
  // Echo Origin and send Access-Control-Allow-Credentials: true.
  bool allow_credentials = 2;
  // 1-16 uppercase tokens, in order.
  repeated string allowed_methods = 3;
  // At most 64 lowercase tokens; ignored with echo_request_headers.
  repeated string allowed_headers = 4;
  // Answer preflights with their Access-Control-Request-Headers.
  bool echo_request_headers = 5;
  // At most 64 tokens.
  repeated string exposed_headers = 6;
  // 0-86400.
  uint32 max_age_seconds = 7;
  // Preflights go to the origin instead of a 204 from the edge.
  bool preflight_to_origin = 8;
  // Keep the origin's Access-Control-* headers when it sent
  // Access-Control-Allow-Origin (otherwise they are replaced).
  bool keep_origin_headers = 9;
  repeated string path_prefixes = 10;
}

// GeoAccess allows or denies requests in scope by the client's country,
// subdivision or ASN (403 geo-denied); GeoIP failures 503
// (policy-unavailable).
message GeoAccess {
  // true: only matching requests pass; false: matching requests get 403.
  bool allow_only = 1;
  // ISO 3166-1 alpha-2, uppercase; at most 256 (needs geoip-city-v1).
  repeated string countries = 2;
  // "CC-subdivision" (ip.geoip.subdivision, compared ASCII case
  // insensitively); at most 256.
  repeated string subdivisions = 3;
  // 1-4294967295; at most 256 (needs geoip-asn-v1).
  repeated uint32 asns = 4;
  // Empty: every path.
  repeated string path_prefixes = 5;
  repeated string except_path_prefixes = 6;
}

// WebSocketAccess restricts WebSocket upgrades by Origin and sets the idle
// timeout of upgraded connections.
message WebSocketAccess {
  // Empty: every origin. Else 1-100 origin forms (no "*" alone); upgrades
  // without a matching Origin get 403 (websocket-origin-denied).
  repeated string origins = 1;
  // 60-86400; 0 means 3600. Config rules' send and read timeouts win.
  uint32 idle_timeout_seconds = 2;
}

// SecurityHeaders set on every response of the site, before the response
// phases (rules may change them).
message SecurityHeaders {
  // X-Content-Type-Options: nosniff.
  bool nosniff = 1;
  // X-Frame-Options: "" (unset), "DENY" or "SAMEORIGIN".
  string frame_options = 2;
  // Referrer-Policy: "" or one of no-referrer, no-referrer-when-downgrade,
  // origin, origin-when-cross-origin, same-origin, strict-origin,
  // strict-origin-when-cross-origin, unsafe-url.
  string referrer_policy = 3;
  // Permissions-Policy: "" or 1-1024 printable ASCII characters.
  string permissions_policy = 4;
  // Remove the Server header.
  bool hide_server = 5;
  // Remove X-Powered-By.
  bool remove_powered_by = 6;
}

// ClientCertificateMode is when a site asks visitors for a certificate.
enum ClientCertificateMode {
  CLIENT_CERTIFICATE_MODE_UNSPECIFIED = 0;
  // Requested and verified; requests without a valid one are served.
  CLIENT_CERTIFICATE_MODE_OPTIONAL = 1;
  // Requests without a valid certificate get the 403 error page
  // (X-Edgeweir-Error: client-cert-required), plain HTTP ones included.
  CLIENT_CERTIFICATE_MODE_REQUIRED = 2;
}

// ClientCertificate verifies visitors' certificates against a CA bundle.
// A failed or missing certificate never aborts the handshake.
message ClientCertificate {
  ClientCertificateMode mode = 1;
  // 1-10 PEM CA certificates, at most 65536 bytes, re-encoded by the console.
  string ca_pem = 2;
  // Verification depth 1-5.
  uint32 depth = 3;
  // Send X-Client-Verify, X-Client-Cert-SHA256, X-Client-Cert-Subject and
  // X-Client-Cert-Serial to the origin. Visitors' own headers of these names
  // are removed on every site regardless.
  bool forward_headers = 4;
}

// PurgeMethod names the key of a site's PURGE method. The key itself is
// never part of the configuration: nodes fetch it with
// NodeService.GetOriginCredentials (an OriginCredential without access key
// id) and check it in the agent.
message PurgeMethod {
  string credential_id = 1;
  // Changes whenever the key changes, so that nodes fetch it again.
  uint64 credential_version = 2;
}

// Maintenance answers a site's requests with 503 and the maintenance page,
// except requests from allowed addresses or to allowed path prefixes and
// HTTP-01 requests for the origin. Nothing is looked up in the cache.
message Maintenance {
  // HTML page with the error page placeholders, 0-65536 bytes; empty uses
  // the node's built-in maintenance page.
  string template = 1;
  // Retry-After seconds, 0 (none) to 86400.
  uint32 retry_after_seconds = 2;
  // Client addresses served as usual: at most 64 CIDRs in canonical form,
  // sorted and unique.
  repeated string allowed_cidrs = 3;
  // Original request paths served as usual when they start with one of
  // these: at most 32, each starting with "/", sorted and unique.
  repeated string allowed_path_prefixes = 4;
}

// Charset adds the charset parameter to the Content-Type of responses of
// type text/*, application/javascript, application/json and
// application/xml that came from the origin or the cache.
message Charset {
  // utf-8, gbk, gb18030, gb2312, big5, iso-8859-1, shift_jis or euc-kr;
  // anything else rejects the configuration.
  string name = 1;
  // Replace a charset the response already names (else it is kept).
  bool force = 2;
  // Send the name in upper case.
  bool uppercase = 3;
}

// BulkRedirect is one entry of a site's exact-match redirect table.
message BulkRedirect {
  // "/path" (every domain of the site) or "host/path" (that lowercase host
  // only): 2-512 bytes without control characters, whitespace or "?".
  string source = 1;
  // Absolute http(s) URL or local path starting with a single "/", at most
  // 1024 bytes, like a static redirect rule.
  string target = 2;
  // 301, 302, 307 or 308.
  uint32 status_code = 3;
  // Append the request's query string to the target.
  bool preserve_query = 4;
}

// SiteErrorPages replaces the node's built-in error pages of a site: 403
// (denied by a rule, an IP list, a ban, the CRS or a missing challenge pass),
// 429 (rate limited), 502, 503 and 504 (origin unavailable or failing).
// Since v0.24.0 (feature site-content-v1) also 400, 401, 404, 405, 410 and
// 500, and the classes 4 (every 4xx status) and 5 (every 5xx status): a
// response takes the page of its status, else the page of its class, else
// the built-in page. Node-generated 400, 403, 405, 413, 414, 429, 500, 502,
// 503 and 504 responses use them.
message SiteErrorPages {
  // At most one page per status, sorted by status. Statuses: 403, 429, 502,
  // 503 and 504 (and those above since v0.24.0); anything else rejects the
  // configuration.
  repeated ErrorPage pages = 1;
  // Also replace error responses of the origin that have a page (of their
  // status or, since v0.24.0, their class; nginx's proxy_intercept_errors).
  // Off, they reach the client unchanged.
  bool intercept_origin_errors = 2;
}

// ErrorPage is an HTML template of 1 to 65536 bytes. The placeholders
// {{status}}, {{request_id}}, {{client_ip}} and {{host}} and, since v0.22.0
// (feature rules-v3), {{time}} (UTC, RFC 3339) and {{path}} (the request
// path) are replaced with HTML-escaped values; any other text, including
// other {{...}}, is sent as it is. Pages are sent with Cache-Control:
// no-store.
message ErrorPage {
  uint32 status = 1;
  string template = 2;
  // Redirect with 302 to this URL instead of sending a template (template
  // is empty then): an absolute http(s) URL or a path starting with a
  // single "/", 1-2048 bytes of printable ASCII without spaces, in which
  // {{status}} and {{request_id}} are replaced with their percent-encoded
  // values (everything but RFC 3986 unreserved characters). Added in
  // v0.24.0 (feature site-content-v1).
  string redirect_url = 3;
  // Send a template page with this status (200-599) instead of the
  // response's; 0 keeps it. Not with redirect_url. Added in v0.24.0.
  uint32 response_status = 4;
}

// PlatformErrorPages are the operator's platform-wide templates, with the
// rules of ErrorPage. An empty template uses the node's built-in page.
message PlatformErrorPages {
  // Hosts no site of the cluster serves (status 404).
  string unknown_host = 1;
  // Offline hosts of disabled sites (status 503).
  string site_disabled = 2;
  reserved 3;
}

// OfflineHost is a domain of a disabled site.
message OfflineHost {
  // Lowercase host name; a wildcard stores its suffix like Domain.
  string name = 1;
  bool wildcard = 2;
  // disabled; anything else rejects the configuration.
  string reason = 3;
  // As Domain.match (v0.25.0, feature domains-v2).
  DomainMatch match = 4;
}

// SiteWaf runs the OWASP Core Rule Set bundled with the node.
message SiteWaf {
  // detect (log only) or block; anything else rejects the configuration.
  string mode = 1;
  // Paranoia level 1-4.
  uint32 paranoia_level = 2;
  // Inbound anomaly score threshold, 1-1000 (CRS default 5).
  uint32 anomaly_threshold = 3;
  // CRS rule ids that never run for this site, sorted and unique.
  repeated uint32 excluded_rule_ids = 4;
  // Request body bytes inspected, 0-134217728; 0 inspects no body.
  uint32 request_body_limit = 5;
  // Exclusions by path or by target, at most 100, in the site's order (the
  // site-wide ones without targets are in excluded_rule_ids). Added in
  // v0.29.0 (feature waf-v2).
  repeated WafExclusion exclusions = 6;
}

// WafExclusion removes CRS rules for the requests of a path, or only some of
// their targets. The node matches path against the client's normalized path
// ($uri, before rewrites; a signed URL's signature removed): exact or as a
// byte prefix; empty matches every path.
message WafExclusion {
  // Empty, or starting with "/", at most 1024 bytes, without "?", "#",
  // whitespace or control characters.
  string path = 1;
  bool exact = 2;
  // CRS rule ids (900000-999999, detection rules only), 1-200, sorted and
  // unique.
  repeated uint32 rule_ids = 3;
  // Targets the rules no longer inspect (ctl:ruleRemoveTargetById), at most
  // 16, sorted and unique: ARGS:<name>, REQUEST_COOKIES:<name> or
  // REQUEST_HEADERS:<name>, names of 1-64 [A-Za-z0-9_.-[]] (headers:
  // [A-Za-z0-9-]). Empty: the rules do not run (ctl:ruleRemoveById).
  repeated string targets = 4;
}

// SiteProtection holds a site's challenge and CC mitigation settings.
// Challenge types and levels are cookie302, js, pow and captcha (in rising
// strength); anything else rejects the configuration.
message SiteProtection {
  // Challenge every GET/HEAD request that carries no valid pass.
  bool under_attack = 1;
  // Challenge type of Under Attack.
  string under_attack_challenge = 2;
  // Lifetime of a pass, 300 to 86400 seconds.
  uint32 pass_ttl_seconds = 3;
  // Leading zero bits of the proof of work, and of the high-difficulty
  // proof of work that replaces the image captcha (accessible path, or
  // CcPolicy.high_pow_instead_of_captcha).
  uint32 pow_difficulty = 4;
  uint32 pow_high_difficulty = 5;
  CcPolicy cc = 6;
  // Record the JA4 fingerprint in sampled access logs (feature ja4-v1).
  bool log_ja4 = 7;
  // Fields 8-11 were added in v0.29.0 (feature challenge-v2).
  //
  // Skip Under Attack (the site's and the platform's) and CC challenges for
  // requests whose User-Agent claims a search engine crawler that the node
  // verifies by reverse DNS of ip.src and a forward lookup of that name.
  bool allow_verified_bots = 8;
  // Title and hint of the site's challenge pages; unset or empty values keep
  // the built-in text.
  ChallengeText challenge_text = 9;
  // Ban a client address (IPv4, IPv6 /64) of the site for
  // failure_ban_seconds (60-86400) once it failed this many challenge
  // answers within 600 seconds; 0 off, else 3-100.
  uint32 failure_threshold = 10;
  uint32 failure_ban_seconds = 11;
}

// ChallengeText is plain text (no control characters, at most 200
// characters each); nodes escape it.
message ChallengeText {
  string title_zh = 1;
  string hint_zh = 2;
  string title_en = 3;
  string hint_en = 4;
}

// CcPolicy raises the challenge level of a site or of attacked paths while
// a trigger holds, and bans addresses over their rate. Decisions are local
// to each node.
message CcPolicy {
  bool enabled = 1;
  // Highest level the policy may reach.
  string max_level = 2;
  // At the captcha level, challenge with the high-difficulty proof of work.
  bool high_pow_instead_of_captcha = 3;
  // Sliding window of every rate, in seconds.
  uint32 window_seconds = 4;
  // Thresholds in requests per second; 0 disables the trigger.
  uint32 site_qps = 5;
  uint32 url_qps = 6;
  uint32 ip_qps = 7;
  // Automatic ban (source auto, reason cc_ip_rate) of an address over ip_qps.
  uint32 ip_ban_seconds = 8;
  // Origin error rate (5xx and failed attempts) in percent, only counted
  // with at least origin_error_min_requests origin requests in the window.
  uint32 origin_error_percent = 9;
  uint32 origin_error_min_requests = 10;
  // A trigger that holds this long raises the level by one step.
  uint32 escalate_after_seconds = 11;
  // Without triggers for this long, the level falls by one step.
  uint32 cooldown_seconds = 12;
}

// PlatformProtection is set by the operator for every site.
message PlatformProtection {
  bool under_attack = 1;
  string under_attack_challenge = 2;
}

// SessionTicketKeyRef names one TLS session ticket key of the cluster.
message SessionTicketKeyRef {
  string id = 1;
  // next, current or previous. Nodes encrypt with current and decrypt with
  // all three.
  string role = 2;
}

// ChallengeKeyRef names one HMAC key for challenge passes.
message ChallengeKeyRef {
  string id = 1;
  // next, current or previous. Nodes sign with current and accept all three.
  string role = 2;
}

// RuleExpression is a bounded, typed AST, never source code to execute.
//
// Since v0.13.0 (feature rules-v2) three more shapes exist: op "call" is a
// function call (field: the function name, value_type: its result type,
// children: the arguments), op "field" an argument that reads a field
// (field, value_type) and op "const" a string argument (value_type
// "string", value). A comparison whose left side is a function has an empty
// field and exactly one child, the value node. A boolean call may stand
// alone as a condition. Functions: lower, upper, len, starts_with,
// ends_with, url_decode and concat in conditions and value expressions;
// regex_replace and wildcard_replace in value expressions only (at most once
// each). Strings are byte strings; see the console's rule-engine package for
// the exact semantics and the shared test vectors.
//
// Since v0.22.0 (feature rules-v3): fields http.request.cookies.<name> and
// http.request.uri.args.<name> (the first raw value of that name, "" when
// absent), http.referer, http.user_agent, http.request.version,
// http.request.scheme, http.request.id, http.request.timestamp.sec,
// edge.server_port, ip.geoip.as_name (feature geoip-asn-v1) and, in the
// response phases, http.response.cache_status; functions url_encode,
// base64_encode, base64_decode, md5, sha1, sha256, substring and to_string
// (in conditions and value expressions); comparisons wildcard and
// strict_wildcard (value: the pattern). to_string takes a value node of any
// type; substring takes a string and one or two op "const" arguments of
// value_type "number" (start, length).
//
// Since v0.23.0 (feature client-ip-v1): field ip.peer (IP), the TCP (QUIC:
// UDP) peer of the connection; ip.src is the client address the cluster's
// ClientAddress setting resolves (equal to ip.peer without one).
//
// Since v0.29.0 (feature rules-body-v1): fields http.request.body.size
// (number: Content-Length, -1 without), http.request.body.raw,
// http.request.body.truncated (boolean) and http.request.body.filenames, and
// functions form_value and json_value (one op "const" string argument: the
// field name, the JSON path), in the request phases request-transform,
// redirect, config, waf-custom, ratelimit and origin only. Feature
// challenge-v2: fields http.request.bot.verified (boolean) and
// http.request.bot.name, in the same phases.
message RuleExpression {
  string op = 1;
  string field = 2;
  string value_type = 3;
  string value = 4;
  repeated string values = 5;
  repeated RuleExpression children = 6;
}

// RuleAction contains only the arguments of the validated action kind.
message RuleAction {
  string kind = 1;
  string value = 2;
  string header = 3;
  uint32 status_code = 4;
  uint32 limit = 5;
  uint32 window_seconds = 6;
  string key = 7;
  optional bool cache_bypass = 8;
  optional bool force_https = 9;
  optional bool gzip = 10;
  bool remove = 11;
  // Challenge type of kind "challenge" (waf-custom): cookie302, js, pow or
  // captcha. Added in v0.10.0 (feature challenge-v1).
  string challenge = 12;
  // Fields 13-31 were added in v0.13.0 (feature rules-v2).
  //
  // Kind "config" (phase config only, except the three fields above):
  // compression switches among the codings the site enables (gzip = true
  // is accepted since v0.13.0); WebSocket upgrades; the site's Under
  // Attack; CC escalation and its highest level; origin timeouts in
  // milliseconds (0 keeps the site's; connect 100-120000, send and read
  // 100-3600000); the sampled access log rate in basis points (0-10000).
  optional bool brotli = 13;
  optional bool zstd = 14;
  optional bool websocket = 15;
  optional bool under_attack = 16;
  optional bool cc_enabled = 17;
  // cookie302, js, pow or captcha; empty keeps the site's.
  string cc_max_level = 18;
  uint32 origin_connect_timeout_ms = 19;
  uint32 origin_send_timeout_ms = 20;
  uint32 origin_read_timeout_ms = 21;
  optional uint32 log_sample_rate = 22;
  // Kinds "redirect" and "rewrite" and, since v0.22.0 (feature rules-v3),
  // "request_header" and "response_header" without remove: a string value
  // expression computed per request instead of the static value (at most
  // one of both is set). A header value that comes out longer than 4096
  // bytes or with a control character skips the header action.
  RuleExpression target = 23;
  // Append (redirect) or keep (rewrite) the request's query string. Unset:
  // a redirect drops it, a rewrite keeps it.
  optional bool preserve_query = 24;
  // Query parameters set after removing those with the same name, sorted
  // by name, at most 16.
  repeated QueryParam set_query = 25;
  // Query parameter names removed, sorted and unique, at most 16.
  repeated string remove_query = 26;
  // Kind "origin" (phase origin): the site's origin group to use (empty
  // keeps the default group), the Host header and TLS SNI sent upstream and
  // the port of every origin of the group (0 keeps theirs). At least one is
  // set; later matching rules override field by field.
  string origin_group = 27;
  string host_header = 28;
  string sni = 29;
  uint32 port = 30;
  // Kind "compression" (phase compression): codings in preference order,
  // a subset of zstd, br and gzip; empty disables compression.
  repeated string compression = 31;
  // Kind "response_header" without remove: add the value as another line
  // of the header next to those the response has. Added in v0.22.0 (feature
  // rules-v3), like the redirect status 303.
  bool append = 32;
  // Kind "config": the request's body limit in bytes (Site.request_body_limit;
  // 0 no limit, at most 10737418240). Unset keeps the site's. Added in
  // v0.24.0 (feature site-content-v1).
  optional uint64 request_body_limit = 33;
  // Fields 34-43 were added in v0.29.0 (feature waf-v2).
  //
  // Kind "ban" (phase waf-custom): ban ip.src, masked to ban_prefix_v4
  // (16-32, 0 means 32) or ban_prefix_v6 (48-64, 0 means 64), for
  // ban_seconds (60-604800) at ban_scope "site" (empty) or "platform"
  // (platform rules only); the request gets 403 ip-banned. Kind
  // "rate_limit": ban_seconds 0 (none) or 60-86400 bans the address over the
  // limit at site scope.
  uint32 ban_seconds = 34;
  string ban_scope = 35;
  uint32 ban_prefix_v4 = 36;
  uint32 ban_prefix_v6 = 37;
  // Kind "respond" (phase waf-custom): status_code 200, 204, 400-499 or
  // 500-599, and either error_page (4xx and 5xx only: the site's error page
  // of the status) or content_type (text/plain, text/html or
  // application/json) with a static body of at most 8192 bytes (empty for
  // 204).
  string content_type = 38;
  string body = 39;
  bool error_page = 40;
  // Kind "skip" (phase waf-custom): what the request skips, sorted and
  // unique, at least one of rules (the remaining waf-custom rules of the
  // rule's scope), rate_limits (platform rules: every rate limit; site
  // rules: the site's), crs and challenges (Under Attack and CC challenges
  // and CC address bans, like allow).
  repeated string skip = 41;
  // Kind "log": write an access log line for the request whatever the
  // sample rate (at most 100 per site and second per node).
  bool access_log = 42;
  // Kind "config" (phase config only): the request's OWASP CRS mode, off,
  // detect or block; empty keeps the site's. Sites without CRS ignore it.
  string crs = 43;
}

// QueryParam is one query parameter a redirect or rewrite sets. name:
// [A-Za-z0-9._~-]{1,64}; value: printable ASCII, at most 256 bytes,
// percent-encoded by the node (everything but RFC 3986 unreserved).
message QueryParam {
  string name = 1;
  string value = 2;
  // A string value expression computed per request instead of value (value
  // is empty then), percent-encoded like it. Added in v0.22.0 (feature
  // rules-v3).
  RuleExpression expression = 3;
}

// EdgeRule is executed in list order inside its fixed phase. Phases, in
// order: request-transform, redirect, config, waf-custom, ratelimit, cache,
// origin, response-transform and, since v0.13.0 (feature rules-v2),
// compression (response fields available, like response-transform).
message EdgeRule {
  string id = 1;
  string phase = 2;
  RuleExpression expression = 3;
  RuleAction action = 4;
}

// IpList is a named collection or an automatically applied platform allow/block list.
message IpList {
  string id = 1;
  string name = 2;
  repeated string entries = 3;
  string kind = 4;
  bool platform = 5;
}

// HTTP and TLS policy. Ciphers come from a named profile, never a cipher string.
message TlsOptions {
  bool force_https = 1;
  uint32 hsts_max_age = 2;
  bool hsts_include_subdomains = 3;
  bool hsts_preload = 4;
  string minimum_version = 5;
  bool http2 = 6;
  bool gzip = 7;
  uint32 gzip_min_length = 8;
  repeated string gzip_types = 9;
  bool ocsp_stapling = 10;
  string cipher_profile = 11;
  bool http3 = 12;
  // Brotli and Zstandard response compression (features brotli-v1 and
  // zstd-v1). Levels: brotli 0-11, zstd 1-19; 0 means the default (brotli
  // 6, zstd 3). Types are MIME types like gzip_types. Added in v0.11.0.
  bool brotli = 13;
  uint32 brotli_level = 14;
  uint32 brotli_min_length = 15;
  repeated string brotli_types = 16;
  bool zstd = 17;
  uint32 zstd_level = 18;
  uint32 zstd_min_length = 19;
  repeated string zstd_types = 20;
  // The HTTPS redirect of force_https and of config rules' force_https:
  // status 301, 302, 303, 307 or 308 (0: 301) and the port of the target
  // URL (0: 443, else one of the site's HTTPS ports in Site.ports). Domains
  // of the site that force_https does not redirect (a config rule's
  // force_https still does): lowercase names as written in the site, a
  // wildcard as "*.suffix", at most 50, sorted and unique. Added in v0.23.0
  // (feature edge-ports-v1).
  uint32 redirect_status = 21;
  uint32 redirect_port = 22;
  repeated string redirect_excluded_domains = 23;
  // Fields 24-25 were added in v0.24.0 (feature site-content-v1):
  // gzip_comp_level 1-9 of the site's server
  // blocks (0: nginx's default, 1) and the largest response, by its known
  // length, that any coding compresses (0: no limit; responses of unknown
  // length are compressed).
  uint32 gzip_level = 24;
  uint64 compress_max_length = 25;
}

// An HTTP-01 response is public; private account and certificate keys are not IR.
message HttpChallenge {
  string domain = 1;
  string token = 2;
  string key_authorization = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// CacheKeyQuery selects which part of the query string enters the cache key.
enum CacheKeyQuery {
  // Same as CACHE_KEY_QUERY_ALL.
  CACHE_KEY_QUERY_UNSPECIFIED = 0;
  // The whole query string as sent by the client.
  CACHE_KEY_QUERY_ALL = 1;
  // No query string at all.
  CACHE_KEY_QUERY_IGNORE = 2;
  // Only the parameters listed in CacheKeyPolicy.query_params.
  CACHE_KEY_QUERY_INCLUDE = 3;
  // Every parameter but those listed in CacheKeyPolicy.query_params, where a
  // name ending in "*" stands for every name with that prefix ("utm_*").
  // Added in v0.24.0 (feature site-content-v1).
  CACHE_KEY_QUERY_EXCLUDE = 4;
}

// CacheKeyPolicy describes the cache key of a site. Every request of the
// site uses the same policy, so that purging a URL covers all its variants.
message CacheKeyPolicy {
  CacheKeyQuery query = 1;
  // Parameter names kept by CACHE_KEY_QUERY_INCLUDE or dropped by
  // CACHE_KEY_QUERY_EXCLUDE (which also takes "prefix*" patterns), sorted.
  repeated string query_params = 2;
  // Sort the kept parameters so that "?a=1&b=2" and "?b=2&a=1" share a key.
  bool sort_query = 3;
  // Lowercase request header names whose values enter the key, sorted.
  repeated string headers = 4;
  // Cookie names whose values enter the key, sorted.
  repeated string cookies = 5;
  // Separate mobile and desktop user agents.
  bool device_type = 6;
  // Leave the Host out of the key: all domains of the site share objects.
  bool exclude_host = 7;
}

// Domain is a host name routed to a site.
message Domain {
  // Lowercase host name without port, e.g. "a.example.com"; with match
  // DOMAIN_MATCH_REGEX a pattern.
  string name = 1;
  // When true, name is a suffix and matches any single left-most label
  // ("*.example.com" is stored as name "example.com", wildcard true).
  bool wildcard = 2;
  // The site's certificate does not cover this domain yet (its ACME
  // certificate is being reissued for it): the domain is served over HTTP
  // only, with no certificate in the TLS handshake and no HTTPS redirect or
  // HSTS, until a revision without the flag. Only on sites with a
  // certificate. Added in v0.19.0 (feature tls-pending-domains-v1); the
  // console sends it only to clusters whose active nodes all report the
  // feature and otherwise leaves such domains out.
  bool tls_pending = 3;
  // How name matches (v0.25.0, feature domains-v2; never with wildcard or
  // tls_pending). A host goes to the site of its exact name, else of the
  // wildcard over its parent, else of the longest DOMAIN_MATCH_SUFFIX
  // name it ends in (after a dot), else of the first DOMAIN_MATCH_REGEX
  // pattern by (order, site id) that matches it. Over HTTPS, a host found
  // through a suffix or pattern completes the handshake only when the
  // site's certificate covers it (a DNS name equal to the host, or "*."
  // and its parent).
  DomainMatch match = 4;
  // DOMAIN_MATCH_REGEX only: the precedence key, lower first: the site's
  // creation time in Unix milliseconds times 16 plus the pattern's index
  // among the site's patterns (0-9).
  uint64 order = 5;
}

// DomainMatch is how a Domain (or OfflineHost) matches the request host.
enum DomainMatch {
  // name exactly, or the single left-most label over it with wildcard.
  DOMAIN_MATCH_UNSPECIFIED = 0;
  // Any subdomain of name at any depth ("x.name", "y.x.name"), not name.
  DOMAIN_MATCH_SUFFIX = 1;
  // name is a regular expression of the rule engine's subset (at most 256
  // characters, letters lowercase outside escapes, no '"', "\\" or
  // whitespace) that must match the whole lowercase host: ^(?:name)$.
  DOMAIN_MATCH_REGEX = 2;
}

// LoadBalancePolicy selects how an origin is picked from a pool.
enum LoadBalancePolicy {
  LOAD_BALANCE_POLICY_UNSPECIFIED = 0;
  LOAD_BALANCE_POLICY_WEIGHTED_RANDOM = 1;
  LOAD_BALANCE_POLICY_ROUND_ROBIN = 2;
  LOAD_BALANCE_POLICY_CONSISTENT_HASH = 3;
}

// OriginPool is the set of upstream servers of a site.
message OriginPool {
  string id = 1;
  LoadBalancePolicy policy = 2;
  repeated Origin origins = 3;
  // Skip certificate verification for HTTPS origins. Certificates are
  // verified against the system trust store by default.
  bool skip_tls_verify = 4;
  // Passive health checking of the origins.
  PassiveHealthCheck health_check = 5;
  // Connection reuse and timeouts towards the origins.
  OriginConnection connection = 6;
  // Active health checks, run by the agent of every node (feature
  // active-health-v1); unset means passive checks only. Added in v0.12.0.
  ActiveHealthCheck active_health_check = 7;
  // Cookie-based session affinity (feature session-affinity-v1); unset
  // means none. Added in v0.12.0.
  SessionAffinity session_affinity = 8;
  // HTTP version of the requests to the origins (feature origin-http2-v1
  // for ORIGIN_PROTOCOL_HTTP2). Unspecified means HTTP/1.1. Added in
  // v0.21.0.
  OriginProtocol protocol = 9;
  // Proxy gRPC requests (Content-Type application/grpc, optionally with a
  // "+" suffix or parameters; not gRPC-Web) over HTTP/2 end to end: the
  // edge forwards them unbuffered with their trailers, so streaming calls
  // in both directions work. They are never cached, their bodies have no
  // size limit, and the OWASP CRS (Site.waf) does not inspect them.
  // Requires protocol ORIGIN_PROTOCOL_HTTP2 (feature origin-http2-v1).
  // Added in v0.21.0.
  bool grpc = 10;
  // Origins a request tries at most, 1-5; 0 means 3. Added in v0.24.0
  // (feature site-content-v1), like the next field.
  uint32 tries = 11;
  // Retry only after connection errors and timeouts, not after a 502, 503
  // or 504 response of the origin (which then reaches the client).
  bool status_retry_disabled = 12;
}

// OriginProtocol is the HTTP version of the requests to a pool's origins.
// HTTP/2 goes over TLS with ALPN "h2" to HTTPS origins and with prior
// knowledge (h2c) to HTTP origins; an origin that does not speak it fails
// the attempt (there is no fallback to HTTP/1.1). WebSocket upgrades use
// HTTP/1.1 whatever the protocol. Added in v0.21.0.
enum OriginProtocol {
  // HTTP/1.1, as before v0.21.0.
  ORIGIN_PROTOCOL_UNSPECIFIED = 0;
  ORIGIN_PROTOCOL_HTTP1 = 1;
  ORIGIN_PROTOCOL_HTTP2 = 2;
}

// ActiveHealthCheck probes every origin of the pool from each node, honoring
// the origin address policy (special-purpose addresses outside
// NodeConfig.origin_allowed_cidrs are refused, also as DNS answers). An
// origin becomes unhealthy after unhealthy_threshold consecutive failed
// probes and healthy again after healthy_threshold consecutive successful
// ones. Merge with the passive check: an origin that either check marks
// down takes no traffic (passive marks last until their recovery time).
// S3-compatible origins are not probed. Probes use the pool's protocol:
// HTTP/2 for ORIGIN_PROTOCOL_HTTP2 (v0.21.0).
message ActiveHealthCheck {
  // Absolute path with an optional query, e.g. "/healthz": 1-1024 bytes of
  // printable ASCII without spaces, starting with "/".
  string path = 1;
  // GET or HEAD.
  string method = 2;
  // Expected response status range, inclusive: 100 <= min <= max <= 599.
  uint32 expected_status_min = 3;
  uint32 expected_status_max = 4;
  // Host header of the probes; empty means the origin's host_header, else
  // its address.
  string host = 5;
  // Seconds between probes of an origin, 5-300.
  uint32 interval_seconds = 6;
  // Seconds a probe may take, 1-60 and at most interval_seconds.
  uint32 timeout_seconds = 7;
  // Consecutive results that change the state, 1-10 each.
  uint32 healthy_threshold = 8;
  uint32 unhealthy_threshold = 9;
}

// SessionAffinity pins a client to the origin that served it with the cookie
// "__ew_affinity": the origin id and an expiry signed with HMAC-SHA256 by the
// cluster's current challenge key (NodeConfig.challenge_keys, so every node
// of the cluster verifies it). A pinned origin that is down, no longer in the
// pool or outside the tier taking traffic (primaries, else backups) is
// replaced, and the cookie is issued again.
message SessionAffinity {
  // Lifetime of the cookie, 60-604800 seconds.
  uint32 ttl_seconds = 1;
}

// PassiveHealthCheck marks an origin down after consecutive failures seen by
// real traffic (connect errors, timeouts and 502/503/504 responses). Zero
// values use the node defaults (3 failures, 30 seconds).
message PassiveHealthCheck {
  // Consecutive failures that mark an origin down.
  uint32 max_fails = 1;
  // Seconds an origin stays down before traffic tries it again.
  uint32 recovery_seconds = 2;
}

// OriginConnection configures upstream connections. Zero values use the
// node defaults (connect 10 s, send 60 s, read 60 s, keep-alive 60 s and
// 1000 requests per connection).
message OriginConnection {
  uint32 connect_timeout_ms = 1;
  uint32 send_timeout_ms = 2;
  uint32 read_timeout_ms = 3;
  // Close upstream connections after every request.
  bool keepalive_disabled = 4;
  // Seconds an idle upstream connection stays in the pool.
  uint32 keepalive_idle_seconds = 5;
  // Requests served over one upstream connection before it is closed.
  uint32 keepalive_max_requests = 6;
}

// OriginScheme is the protocol used to talk to an origin.
enum OriginScheme {
  ORIGIN_SCHEME_UNSPECIFIED = 0;
  ORIGIN_SCHEME_HTTP = 1;
  ORIGIN_SCHEME_HTTPS = 2;
}

// Origin is one upstream server.
message Origin {
  string id = 1;
  // Host name or IP literal.
  string address = 2;
  uint32 port = 3;
  OriginScheme scheme = 4;
  // Relative weight inside the pool, at least 1.
  uint32 weight = 5;
  // Backup origins only receive traffic when all primaries are down.
  bool backup = 6;
  // Host header sent upstream; empty means forward the client Host.
  string host_header = 7;
  // TLS SNI for HTTPS origins; empty means derive from host_header/address.
  string sni = 8;
  // Sign requests with AWS Signature Version 4 (S3-compatible object
  // storage). Only GET and HEAD requests are forwarded to such origins.
  S3Auth s3 = 9;
  // Origin group inside the site, [a-z0-9_-]{1,32}; empty is the default
  // group. Only origin rules (RuleAction.origin_group) send traffic to the
  // other groups. Added in v0.13.0 (feature rules-v2).
  string group = 10;
}

// S3Auth references the credential used to sign requests to an S3-compatible
// origin. The secret itself is never part of the configuration; nodes fetch
// it with NodeService.GetOriginCredentials over mutual TLS.
message S3Auth {
  // Signing region, e.g. "us-east-1".
  string region = 1;
  // Bucket for path-style requests ("/<bucket>/<key>"); empty when the
  // origin address already names the bucket (virtual-hosted style).
  string bucket = 2;
  // Id of the credential to fetch.
  string credential_id = 3;
  // Changes whenever the credential changes, so that nodes fetch it again.
  uint64 credential_version = 4;
}

// CacheAction is what a matching cache rule does.
enum CacheAction {
  CACHE_ACTION_UNSPECIFIED = 0;
  CACHE_ACTION_CACHE = 1;
  CACHE_ACTION_BYPASS = 2;
}

// OriginCacheControl decides whether origin caching headers win.
enum OriginCacheControl {
  ORIGIN_CACHE_CONTROL_UNSPECIFIED = 0;
  // Use edge_ttl_seconds regardless of origin headers.
  ORIGIN_CACHE_CONTROL_OVERRIDE = 1;
  // Honour Cache-Control/Expires from the origin, falling back to
  // edge_ttl_seconds when the origin sends none.
  ORIGIN_CACHE_CONTROL_RESPECT = 2;
}

// CacheRule decides whether and for how long a response is cached.
// Rules are evaluated in (priority, id) order and the first match wins.
message CacheRule {
  string id = 1;
  uint32 priority = 2;
  CacheRuleMatch match = 3;
  CacheAction action = 4;
  uint32 edge_ttl_seconds = 5;
  OriginCacheControl origin_cache_control = 6;
  // Serve a stale object for this long after it expired while it is being
  // refreshed in the background (RFC 5861); 0 disables it.
  uint32 stale_while_revalidate_seconds = 7;
  // Serve a stale object for this long after it expired when the origin
  // fails (RFC 5861); 0 disables it.
  uint32 stale_if_error_seconds = 8;
  // Cache responses to requests that carry an Authorization header. Off
  // (the default), such requests bypass the cache and their responses are
  // never stored (RFC 9111 section 3.5). Added in v0.2.1; older agents
  // ignore it and keep their previous behavior.
  bool cache_authorized = 9;
  // Cache-Control: max-age=N towards clients for responses this rule
  // caches; 0 keeps the origin's header. At most 31536000. Added in v0.13.0
  // (feature rules-v2).
  uint32 browser_ttl_seconds = 10;
  // Cache responses that carry Set-Cookie when this rule decides them. Only
  // the response fetched from the origin for a request carries the
  // Set-Cookie lines; hits, stale and updating responses never do. Added in
  // v0.24.0 (feature site-content-v1).
  bool cache_set_cookie = 11;
}

// CacheRuleMatch is the condition of a cache rule. Empty lists match all
// requests. When several conditions are set, all of them must match.
// Request conditions (paths, prefixes, extensions) are checked when the
// request arrives; response conditions (status codes, size) when the origin
// answers. A rule whose response conditions fail passes the decision on to
// the next rule whose request conditions matched.
message CacheRuleMatch {
  // URI path prefixes, e.g. "/static/".
  repeated string path_prefixes = 1;
  // File extensions without the dot, lowercase, e.g. "png".
  repeated string extensions = 2;
  // Reserved; nodes reject configs where this is non-empty. Expressions
  // travel as the typed `condition` below.
  string expression = 3;
  // Exact URI paths, e.g. "/index.html".
  repeated string paths = 4;
  // Response status codes, sorted; empty means any status the rule may cache.
  repeated uint32 status_codes = 5;
  // Minimum response size in bytes (Content-Length); 0 means no minimum.
  uint64 min_size_bytes = 6;
  // Maximum response size in bytes (Content-Length); 0 means no maximum.
  uint64 max_size_bytes = 7;
  // Request condition as a typed expression (phase cache), evaluated on the
  // client's original request before any rewrite, like the cache key. When
  // set, path_prefixes, paths and extensions are empty. Added in v0.13.0
  // (feature rules-v2).
  RuleExpression condition = 8;
}

// CertificateRef points at a certificate stored in the console.
message CertificateRef {
  string id = 1;
  repeated string names = 2;
  string sha256_fingerprint = 3;
  google.protobuf.Timestamp not_after = 4;
}
