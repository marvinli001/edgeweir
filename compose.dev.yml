# Local development database for `pnpm dev` (matches DATABASE_URL in .env.example).
#   docker compose -f compose.dev.yml up -d
name: edgeweir-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: edgeweir
      POSTGRES_PASSWORD: edgeweir
      POSTGRES_DB: edgeweir
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeweir -d edgeweir"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-dev:
