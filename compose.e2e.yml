# End-to-end environment: postgres + console + one edge node (OpenResty) +
# test origins + test clients. Used by scripts/e2e.sh and CI:
#   docker compose -f compose.e2e.yml up -d --build
#   pnpm e2e
# The node image is built from the sibling edgeweir-node checkout, with
# nftables usable by the agent (NFT_CAPABILITY=true, cap_add NET_ADMIN) for
# kernel bans; the default deployment files grant neither.
# Test-only secrets below are fixed on purpose; never reuse them.
# A second environment can run next to this one with its own project name,
# ports, image tag and subnets, e.g.:
#   COMPOSE_PROJECT_NAME=edgeweir-e2e-2 E2E_CONSOLE_PORT=13100 E2E_NODE_PORT=18180 E2E_TAG=e2e-2 \
#   E2E_SUBNET=172.28.223.0/24 E2E_ISOLATED_SUBNET=172.28.224.0/24 ...
#
# Networks: origins on private addresses are refused by default (N-H2), so
# scripts/e2e.sh puts the default network's subnet (E2E_SUBNET, pinned here
# so that it is known) on the platform's origin allow list. The "isolated"
# network stays outside it: its "hidden" origin must be refused by the node.
name: edgeweir-e2e

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: edgeweir
      POSTGRES_PASSWORD: e2e-only-password
      POSTGRES_DB: edgeweir
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeweir -d edgeweir"]
      interval: 2s
      timeout: 3s
      retries: 30

  console:
    build:
      context: .
    image: edgeweir:${E2E_TAG:-e2e}
    environment:
      ROLE: all
      DATABASE_URL: postgres://edgeweir:e2e-only-password@postgres:5432/edgeweir
      EDGEWEIR_MASTER_KEY: ZTJlLW9ubHktbWFzdGVyLWtleS1kby1ub3QtcmV1c2UhIQ==
      BETTER_AUTH_SECRET: e2e-only-better-auth-secret-do-not-reuse
      EDGEWEIR_PUBLIC_URL: http://localhost:${E2E_CONSOLE_PORT:-13000}
      EDGEWEIR_NODE_API_URL: https://console:8443
      # Release mirror for install.sh; scripts/e2e.sh fills the volume with
      # goreleaser snapshot packages of the node.
      EDGEWEIR_DOWNLOADS_DIR: /srv/downloads
      EDGEWEIR_NODE_RELEASE_BASE_URL: http://upgrade-files/releases
      EDGEWEIR_ANALYTICS: ${E2E_ANALYTICS:-lite}
      EDGEWEIR_CLICKHOUSE_URL: http://clickhouse:8123
      EDGEWEIR_CLICKHOUSE_PASSWORD: e2e-clickhouse-password
      LOG_LEVEL: debug
      EDGEWEIR_OUTBOUND_ALLOW_CIDRS: ${E2E_SUBNET:-172.28.213.0/24}
      EDGEWEIR_DNS_TEST_ENDPOINT: http://mock-services:8080
      EDGEWEIR_ACME_DIRECTORY: https://pebble:14000/dir
      EDGEWEIR_ACME_CA_FILE: /e2e/pebble/test-only.crt
    ports:
      - "${E2E_CONSOLE_PORT:-13000}:3000"
    volumes:
      - downloads:/srv/downloads:ro
      - ./docker/e2e/pebble/test-only.crt:/e2e/pebble/test-only.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  clickhouse:
    image: clickhouse/clickhouse-server:26.9-alpine@sha256:7ad5e1f369d243e3d5d3bb1fe926147b251bb14c08cdb833bd421d191d476b9f
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: edgeweir
      CLICKHOUSE_USER: edgeweir
      CLICKHOUSE_PASSWORD: e2e-clickhouse-password
    ports:
      - "127.0.0.1:${E2E_CLICKHOUSE_PORT:-19123}:8123"
    # The image's entrypoint first runs a temporary server on 127.0.0.1 only
    # (to create the user and database) and then restarts it: asking the
    # container's own address is healthy only once the real server listens.
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host \"$$(hostname -i | cut -d' ' -f1)\" --user edgeweir --password e2e-clickhouse-password --query 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30

  whoami:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44

  # Real HTTP-01 validation against the node; no ALWAYS_VALID bypass.
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
    command: ["-config", "/e2e/config.json", "-strict"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    volumes:
      - ./docker/e2e/pebble:/e2e:ro
    ports:
      - "127.0.0.1:${E2E_ACME_PORT:-14000}:14000"
      - "127.0.0.1:${E2E_ACME_MGMT_PORT:-15000}:15000"

  # MVP M2: failover pair (scripts/e2e.sh stops and starts the primary).
  origin-primary:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    command: ["--name", "primary"]

  origin-backup:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    command: ["--name", "backup"]

  # N-H2: an origin only on the isolated network. The node resolves "hidden"
  # to an address outside the allow list and must refuse it (502).
  hidden:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    command: ["--name", "hidden"]
    networks: [isolated]

  # MVP M2: static files over HTTP (Range / slice; the access log records the
  # Range header each request carried) and HTTPS: :443 with a self-signed
  # certificate, :9443 with a certificate for "files" issued by a test CA
  # that the node trusts (written to the origin-ca volume).
  files:
    image: openresty/openresty:1.31.1.1-bookworm@sha256:8005b87dcb25df5e202e71dcc4b8a2c20a4845a75302b2bb6ee816b5392883e4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /srv/static &&
        head -c 3145728 /dev/urandom > /srv/big.bin &&
        echo static > /srv/static/a.txt &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=files
        -addext subjectAltName=DNS:files -keyout /tmp/files.key -out /tmp/files.crt 2>/dev/null &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=Edgeweir e2e origin CA'
        -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign
        -keyout /tmp/ca.key -out /tmp/ca.crt 2>/dev/null &&
        openssl req -new -newkey rsa:2048 -nodes -subj /CN=files -keyout /tmp/trusted.key -out /tmp/trusted.csr 2>/dev/null &&
        printf 'basicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:files\n' > /tmp/trusted.ext &&
        openssl x509 -req -in /tmp/trusted.csr -CA /tmp/ca.crt -CAkey /tmp/ca.key -CAcreateserial -days 2
        -extfile /tmp/trusted.ext -out /tmp/trusted.crt 2>/dev/null &&
        cp /tmp/ca.crt /shared/origin-ca.pem.tmp && mv /shared/origin-ca.pem.tmp /shared/origin-ca.pem &&
        exec openresty -g 'daemon off;' -c /etc/e2e/files.conf
    volumes:
      - ./docker/e2e/files.conf:/etc/e2e/files.conf:ro
      - origin-ca:/shared
    # The node's nginx.conf references the test CA: start the node once it exists.
    healthcheck:
      test: ["CMD", "test", "-s", "/shared/origin-ca.pem"]
      interval: 1s
      retries: 30

  # MVP M2: S3-compatible object storage (Versity S3 Gateway, Apache-2.0)
  # for SigV4-signed origin requests: bucket "media" with one object.
  s3:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /data/media &&
        printf 'hello from s3\n' > /data/media/hello.txt &&
        exec versitygw --port :7070 --access e2e-access-key --secret e2e-only-s3-secret-key posix /data

  mock-services:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["node", "/mock/server.mjs"]
    volumes:
      - ./docker/e2e/mock-services:/mock:ro
    ports:
      - "${E2E_MOCK_PORT:-19090}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  # G4: test origins that name themselves, number and count their responses
  # and can be broken (/health status, connection resets) and repaired from
  # the e2e network (scripts/e2e-g4.mjs).
  g4-origin-a:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["node", "/g4/server.mjs", "a"]
    volumes:
      - ./docker/e2e/g4-origin:/g4:ro
    init: true
    read_only: true

  g4-origin-b:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["node", "/g4/server.mjs", "b"]
    volumes:
      - ./docker/e2e/g4-origin:/g4:ro
    init: true
    read_only: true

  # G7: layer-4 test origins (docker/e2e/l4-origin): TCP echo 7000, UDP echo
  # 7001, a PROXY protocol reader on 7002; each tells its name on request.
  l4-origin-a:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["node", "/l4/server.mjs", "a"]
    volumes:
      - ./docker/e2e/l4-origin:/l4:ro
    init: true
    read_only: true

  l4-origin-b:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["node", "/l4/server.mjs", "b"]
    volumes:
      - ./docker/e2e/l4-origin:/l4:ro
    init: true
    read_only: true

  # G1: clients on the default network that reach the node by its container
  # address; scripts/e2e-g1.mjs bans client-a and keeps client-b as the control.
  client-a:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["tail", "-f", "/dev/null"]
    init: true
    read_only: true

  client-b:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["tail", "-f", "/dev/null"]
    init: true
    read_only: true

  # G2: a client on the isolated network only (another /24 than client-a and
  # client-b); scripts/e2e-g2.mjs shows that a pass is bound to the prefix.
  client-c:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["tail", "-f", "/dev/null"]
    init: true
    read_only: true
    networks: [isolated]

  geoip-fixture:
    build:
      context: ${EDGEWEIR_NODE_CONTEXT:-../edgeweir-node}
      target: geoip-fixture
    image: edgeweir-geoip-fixture:${E2E_TAG:-e2e}
    volumes:
      - geoip-test-data:/data

  node:
    build:
      context: ${EDGEWEIR_NODE_CONTEXT:-../edgeweir-node}
      # nft gets the file capability cap_net_admin, so the agent (not root)
      # can manage its nftables table for kernel bans.
      args:
        NFT_CAPABILITY: "true"
    image: edgeweir-node:${E2E_TAG:-e2e}
    hostname: edge-e2e-1
    # Kernel bans: the agent reports kernel-ban-v1 only with this capability.
    cap_add: [NET_ADMIN]
    environment:
      # Trust store for HTTPS origins (instead of the system bundle): the
      # test CA only, so the self-signed :443 of "files" stays untrusted.
      EDGEWEIR_TRUSTED_CA: /etc/edgeweir-e2e/origin-ca.pem
      EDGEWEIR_UPGRADE_SOURCE: http://upgrade-files/releases
      EDGEWEIR_UPGRADE_PUBLIC_KEY: /etc/edgeweir-upgrade/release.pub
      EDGEWEIR_UPGRADE_ALLOW_HTTP: "true"
      EDGEWEIR_GEOIP_IPINFO: /etc/edgeweir-geoip/ipinfo_lite.mmdb
      EDGEWEIR_GEOIP_CITY: /etc/edgeweir-geoip/city.mmdb
      EDGEWEIR_GEOIP_ASN: /etc/edgeweir-geoip/asn.mmdb
    ports:
      - "${E2E_NODE_PORT:-18080}:80"
      - "${E2E_NODE_TLS_PORT:-18443}:443"
      - "${E2E_NODE_TLS_PORT:-18443}:443/udp"
    volumes:
      - node-state:/var/lib/edgeweir-node
      - upgrade-trust:/etc/edgeweir-upgrade:ro
      - geoip-test-data:/etc/edgeweir-geoip:ro
      - origin-ca:/etc/edgeweir-e2e:ro
    networks:
      default:
        aliases: [demo.test, https.m3.test]
      isolated: {}
    depends_on:
      geoip-fixture:
        condition: service_completed_successfully
      console:
        condition: service_healthy
      whoami:
        condition: service_started
      origin-primary:
        condition: service_started
      origin-backup:
        condition: service_started
      hidden:
        condition: service_started
      files:
        condition: service_healthy
      s3:
        condition: service_started

  upgrade-files:
    image: openresty/openresty:1.31.1.1-bookworm@sha256:8005b87dcb25df5e202e71dcc4b8a2c20a4845a75302b2bb6ee816b5392883e4
    profiles: ["upgrades"]
    command: ["openresty", "-g", "daemon off;", "-c", "/etc/nginx/upgrade.conf"]
    volumes:
      - ./docker/e2e/upgrade.conf:/etc/nginx/upgrade.conf:ro
      - upgrade-releases:/srv/upgrades:ro

  node-upgrade-peer:
    # The image of "node" (built with NFT_CAPABILITY=true), with the same capability.
    image: edgeweir-node:${E2E_TAG:-e2e}
    profiles: ["upgrades"]
    hostname: edge-upgrade-peer
    cap_add: [NET_ADMIN]
    environment:
      EDGEWEIR_TRUSTED_CA: /etc/edgeweir-e2e/origin-ca.pem
      EDGEWEIR_GEOIP_IPINFO: /etc/edgeweir-geoip/ipinfo_lite.mmdb
      EDGEWEIR_GEOIP_CITY: /etc/edgeweir-geoip/city.mmdb
      EDGEWEIR_GEOIP_ASN: /etc/edgeweir-geoip/asn.mmdb
      EDGEWEIR_UPGRADE_SOURCE: http://upgrade-files/releases
      EDGEWEIR_UPGRADE_PUBLIC_KEY: /etc/edgeweir-upgrade/release.pub
      EDGEWEIR_UPGRADE_ALLOW_HTTP: "true"
    volumes:
      - node-upgrade-peer-state:/var/lib/edgeweir-node
      - geoip-test-data:/etc/edgeweir-geoip:ro
      - origin-ca:/etc/edgeweir-e2e:ro
      - upgrade-trust:/etc/edgeweir-upgrade:ro
    networks:
      default: {}
      isolated: {}

  # Cluster DNS bindings: the only node of a second cluster ("dns-b"), enrolled
  # by scripts/e2e-dns.mjs, so two clusters publish through two accounts.
  node-dns:
    image: edgeweir-node:${E2E_TAG:-e2e}
    profiles: ["dns"]
    hostname: edge-dns-b
    environment:
      EDGEWEIR_TRUSTED_CA: /etc/edgeweir-e2e/origin-ca.pem
      EDGEWEIR_GEOIP_IPINFO: /etc/edgeweir-geoip/ipinfo_lite.mmdb
      EDGEWEIR_GEOIP_CITY: /etc/edgeweir-geoip/city.mmdb
      EDGEWEIR_GEOIP_ASN: /etc/edgeweir-geoip/asn.mmdb
    volumes:
      - node-dns-state:/var/lib/edgeweir-node
      - geoip-test-data:/etc/edgeweir-geoip:ro
      - origin-ca:/etc/edgeweir-e2e:ro
    networks:
      default: {}

  # G6: two regional probes (`edgeweir-node probe`, no OpenResty) on both e2e
  # networks, so they reach the nodes' primary (default network) and backup
  # (isolated network) scheduling addresses. scripts/e2e-g6.mjs creates the
  # one-time probe tokens and starts them with EDGEWEIR_SERVER,
  # EDGEWEIR_CA_SHA256 and EDGEWEIR_TOKEN; afterwards the identity in the
  # state volume is enough.
  probe-a:
    image: edgeweir-node:${E2E_TAG:-e2e}
    profiles: ["probes"]
    hostname: probe-east
    entrypoint: ["/usr/local/bin/edgeweir-node", "probe"]
    # The image's healthcheck asks the data plane, which probes do not run.
    healthcheck:
      disable: true
    environment:
      EDGEWEIR_SERVER: ${E2E_PROBE_SERVER:-}
      EDGEWEIR_CA_SHA256: ${E2E_PROBE_CA_SHA256:-}
      EDGEWEIR_TOKEN: ${E2E_PROBE_A_TOKEN:-}
      EDGEWEIR_STATE_DIR: /var/lib/edgeweir-probe
    volumes:
      - probe-a-state:/var/lib/edgeweir-probe
    restart: on-failure
    networks:
      default: {}
      isolated: {}

  probe-b:
    image: edgeweir-node:${E2E_TAG:-e2e}
    profiles: ["probes"]
    hostname: probe-north
    entrypoint: ["/usr/local/bin/edgeweir-node", "probe"]
    # The image's healthcheck asks the data plane, which probes do not run.
    healthcheck:
      disable: true
    environment:
      EDGEWEIR_SERVER: ${E2E_PROBE_SERVER:-}
      EDGEWEIR_CA_SHA256: ${E2E_PROBE_CA_SHA256:-}
      EDGEWEIR_TOKEN: ${E2E_PROBE_B_TOKEN:-}
      EDGEWEIR_STATE_DIR: /var/lib/edgeweir-probe
    volumes:
      - probe-b-state:/var/lib/edgeweir-probe
    restart: on-failure
    networks:
      default: {}
      isolated: {}

networks:
  default:
    ipam:
      config:
        - subnet: ${E2E_SUBNET:-172.28.213.0/24}
  isolated:
    ipam:
      config:
        - subnet: ${E2E_ISOLATED_SUBNET:-172.28.214.0/24}

volumes:
  upgrade-trust:
  upgrade-releases:
  node-upgrade-peer-state:
  node-dns-state:
  geoip-test-data:
  node-state:
  probe-a-state:
  probe-b-state:
  origin-ca:
  downloads:
