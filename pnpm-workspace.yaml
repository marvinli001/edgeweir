packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  "@bufbuild/buf": true
  "@biomejs/biome": true
  turbo: true
  msw: false
  cpu-features: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - turbo@2.11.4
  - '@appica/ui-react@1.2.0'
